<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROSTO">
<title>ROSTO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<style>
  :root {
    --bg:#0A0A0A;
    --surface:#141414;
    --surface2:#1C1C1C;
    --surface3:#252525;
    --line:#2A2A2A;
    --text:#ECECEC;
    --muted:#8A8A8A;
    --accent:#4D6BFE;
    --accent-2:#7C4DFF;
    --accent-ink:#FFFFFF;
    --accent-hover:#3D5BEE;
    --danger:#F08A7A;
    --success:#6BCB77;
    --warning:#FFD93D;
    --code-bg:#0D0D0D;
    --hdr:rgba(10,10,10,0.85);
    --cmp:rgba(10,10,10,0.98);
    --drawer:rgba(10,10,10,0.98);
    --glow:0 0 20px rgba(77,107,254,.3);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
    --shadow-md:0 4px 16px rgba(0,0,0,.3);
  }
  [data-theme="light"]{
    --bg:#FAFAFB;--surface:#FFFFFF;--surface2:#F2F2F4;--surface3:#E8E8EC;--line:#E2E2E6;
    --text:#16171B;--muted:#6B6B72;--accent:#4D6BFE;--accent-2:#7C4DFF;--accent-ink:#FFFFFF;--accent-hover:#3D5BEE;
    --code-bg:#F4F4F6;--hdr:rgba(250,250,251,0.85);--cmp:rgba(250,250,251,0.98);--drawer:rgba(250,250,251,0.98);
    --glow:0 0 20px rgba(77,107,254,.2);
    --shadow-lg:0 12px 40px rgba(0,0,0,.12);
    --shadow-md:0 4px 16px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
    font-size:15px;line-height:1.7;
    display:flex;flex-direction:column;height:100dvh;
    transition:background .4s ease,color .4s ease;
    position:relative;overflow:hidden;
  }
  /* Animated aurora background */
  .bg-aurora{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:
      radial-gradient(ellipse 600px 400px at 10% 10%, rgba(77,107,254,.22), transparent 60%),
      radial-gradient(ellipse 500px 400px at 90% 20%, rgba(124,77,255,.18), transparent 60%),
      radial-gradient(ellipse 500px 500px at 50% 90%, rgba(77,107,254,.14), transparent 60%);
    animation:auroraShift 25s ease-in-out infinite alternate;
    filter:blur(2px);
  }
  [data-theme="light"] .bg-aurora{opacity:.35}
  @keyframes auroraShift{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-3%,2%) scale(1.05)}
    100%{transform:translate(3%,-2%) scale(1.02)}
  }
  /* Subtle grid pattern */
  .bg-grid{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.025;
    background-image:
      linear-gradient(var(--text) 1px, transparent 1px),
      linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size:32px 32px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  button{font:inherit;color:inherit;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  ::selection{background:rgba(77,107,254,.35);color:var(--text)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--surface3)}

  /* ========== Top Bar ========== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    background:var(--hdr);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    position:relative;z-index:5;flex-shrink:0;
    min-height:56px;
    border-bottom:1px solid transparent;
    transition:border-color .3s;
  }
  .topbar.scrolled{border-bottom-color:var(--line)}
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:4px}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);flex-shrink:0;position:relative;
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .icon-btn svg{width:22px;height:22px;transition:transform .3s}
  .icon-btn:hover{background:var(--surface2);transform:translateY(-1px)}
  .icon-btn:hover svg{transform:scale(1.1)}
  .icon-btn:active{transform:scale(.92)}
  .logo-center{
    display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:18px;letter-spacing:-.5px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    cursor:pointer;
  }
  .logo-center svg{width:28px;height:28px;color:var(--accent);-webkit-text-fill-color:var(--accent)}

  /* ========== Chat ========== */
  #chat{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:16px 12px 8px;
    display:flex;flex-direction:column;gap:20px;
    -webkit-overflow-scrolling:touch;
    position:relative;z-index:1;scroll-behavior:smooth;
    scroll-padding-top:20px;
  }
  .msg{max-width:100%;word-wrap:break-word;overflow-wrap:anywhere;
    animation:msgIn .45s cubic-bezier(.22,1,.36,1)}
  @keyframes msgIn{
    from{opacity:0;transform:translateY(12px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .msg.user{
    align-self:flex-end;max-width:85%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    padding:10px 16px;border-radius:20px 20px 6px 20px;
    font-size:15px;line-height:1.6;
    box-shadow:0 4px 16px rgba(77,107,254,.25);
    position:relative;
    transition:transform .2s;
  }
  .msg.user:hover{transform:translateY(-1px)}
  .msg.assistant{align-self:stretch;padding:0 4px;color:var(--text);
    animation:msgInRight .5s cubic-bezier(.22,1,.36,1)}
  @keyframes msgInRight{
    from{opacity:0;transform:translateX(-10px)}
    to{opacity:1;transform:translateX(0)}
  }
  .msg.err{color:var(--danger);font-size:14px;padding:8px 12px;background:rgba(240,138,122,.1);border-radius:10px;border:1px solid rgba(240,138,122,.25)}

  .msg code{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Code",monospace;
    font-size:.88em;background:var(--surface2);
    padding:2px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed;
    color:#E8B84B;border:1px solid var(--line);
  }
  .msg pre{
    direction:ltr;text-align:left;background:var(--code-bg);
    border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin:12px 0;overflow-x:auto;
    line-height:1.55;position:relative;font-size:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .msg pre::before{
    content:"";position:absolute;top:10px;right:14px;
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);opacity:.4;
  }
  .msg pre code{background:none;padding:0;font-size:13px;color:var(--text);border:0}
  .msg pre .copy-code{
    position:absolute;top:8px;right:8px;
    background:var(--surface2);border:1px solid var(--line);
    border-radius:8px;padding:4px 12px;font-size:11px;
    color:var(--muted);font-family:inherit;
    transition:all .2s;
  }
  .msg pre .copy-code:hover{color:var(--accent);border-color:var(--accent);background:var(--surface3)}
  .msg table{border-collapse:collapse;margin:12px 0;width:100%;font-size:13px;display:block;overflow-x:auto;border-radius:10px}
  .msg table th,.msg table td{border:1px solid var(--line);padding:8px 12px}
  .msg table th{background:var(--surface2);font-weight:600}
  .msg table tr:nth-child(even) td{background:var(--surface)}
  .msg ul,.msg ol{padding-inline-start:24px;margin:8px 0}
  .msg li{margin:5px 0}
  .msg blockquote{
    border-inline-start:3px solid var(--accent);
    padding:6px 14px;margin:10px 0;color:var(--muted);
    background:var(--surface);border-radius:0 10px 10px 0;
  }
  .msg h1,.msg h2,.msg h3{margin:14px 0 8px;line-height:1.3;font-weight:600}
  .msg h1{font-size:1.4em}
  .msg h2{font-size:1.22em}
  .msg h3{font-size:1.1em}
  .msg h1::before,.msg h2::before{content:"";display:inline-block;width:4px;height:1em;background:var(--accent);margin-inline-end:10px;border-radius:2px;vertical-align:middle;margin-top:-4px}
  .msg a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
  .msg a:hover{border-bottom-color:var(--accent)}
  .msg hr{border:0;border-top:1px solid var(--line);margin:14px 0}

  /* ========== Msg Actions ========== */
  .msg-actions{
    display:flex;gap:4px;margin-top:8px;
    opacity:0;transition:opacity .25s;flex-wrap:wrap;align-items:center;
    transform:translateY(-4px);
  }
  .msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1;transform:translateY(0)}
  @media (hover:none){.msg-actions{opacity:.85;transform:translateY(0)}}
  .msg-actions button{
    width:32px;height:32px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);transition:all .2s;
  }
  .msg-actions button svg{width:15px;height:15px}
  .msg-actions button:hover{background:var(--surface2);color:var(--text);transform:translateY(-1px)}
  .msg-actions button:active{transform:scale(.9)}
  .msg-actions button.active{color:var(--accent);background:rgba(77,107,254,.1)}
  .usage-badge{
    font-size:10px;color:var(--muted);background:var(--surface2);
    padding:2px 8px;border-radius:10px;margin-inline-start:6px;
    display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line);
  }
  .usage-badge::before{content:"◆";color:var(--accent);font-size:8px}

  /* ========== Welcome ========== */
  .welcome{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:30px 20px;text-align:center;gap:26px;
    animation:welcomeIn .8s cubic-bezier(.22,1,.36,1);
  }
  @keyframes welcomeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .welcome-logo{
    width:96px;height:96px;
    color:var(--accent);position:relative;
    animation:floatLogo 5s ease-in-out infinite;
    filter:drop-shadow(0 0 30px rgba(77,107,254,.4));
  }
  .welcome-logo::before{
    content:"";position:absolute;inset:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(77,107,254,.25), transparent 70%);
    animation:pulseHalo 3s ease-in-out infinite;
  }
  @keyframes floatLogo{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes pulseHalo{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
  .welcome-logo svg{width:100%;height:100%;position:relative;z-index:1}
  .welcome h1{
    margin:0;font-size:26px;font-weight:600;
    line-height:1.4;letter-spacing:-.5px;
    background:linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    max-width:520px;
  }
  .welcome .subtitle{color:var(--muted);font-size:14px;margin-top:-14px;max-width:420px}
  .welcome-actions{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;width:100%;max-width:520px;margin-top:8px;
  }
  @media (min-width:600px){.welcome-actions{grid-template-columns:repeat(2,1fr)}}
  .welcome-chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;font-size:13px;color:var(--text);
    display:flex;align-items:center;gap:10px;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    text-align:right;position:relative;overflow:hidden;
  }
  .welcome-chip::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg, transparent, rgba(77,107,254,.06));
    opacity:0;transition:opacity .25s;
  }
  .welcome-chip:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .welcome-chip:hover::before{opacity:1}
  .welcome-chip:active{transform:translateY(0) scale(.98)}
  .welcome-chip svg{width:18px;height:18px;color:var(--accent);flex-shrink:0;transition:transform .3s}
  .welcome-chip:hover svg{transform:rotate(-8deg) scale(1.1)}
  .welcome-chip .chip-body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .welcome-chip .chip-title{font-weight:600;font-size:13px}
  .welcome-chip .chip-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ========== Typing ========== */
  .typing{display:inline-flex;align-items:center;gap:5px;padding:6px 0}
  .typing .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    animation:typingBounce 1.4s infinite ease-in-out;
    box-shadow:0 0 8px rgba(77,107,254,.5);
  }
  .typing .dot:nth-child(1){animation-delay:0s}
  .typing .dot:nth-child(2){animation-delay:.15s}
  .typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0) scale(.8);opacity:.4}
    30%{transform:translateY(-7px) scale(1.1);opacity:1}
  }

  /* ========== Reasoning ========== */
  .reasoning{
    background:linear-gradient(135deg, var(--surface), var(--surface2));
    border:1px solid var(--line);
    border-radius:12px;margin-bottom:12px;padding:0;font-size:13px;
    overflow:hidden;transition:all .3s;
  }
  .reasoning[open]{padding:0}
  .reasoning summary{
    cursor:pointer;color:var(--muted);font-weight:500;
    user-select:none;display:flex;align-items:center;gap:8px;
    font-size:13px;padding:12px 14px;
    list-style:none;transition:background .2s;
  }
  .reasoning summary::-webkit-details-marker{display:none}
  .reasoning summary::after{
    content:"";margin-inline-start:auto;
    width:0;height:0;
    border-inline-start:5px solid transparent;
    border-inline-end:5px solid transparent;
    border-top:5px solid var(--muted);
    transition:transform .3s;
  }
  .reasoning[open] summary::after{transform:rotate(180deg)}
  .reasoning summary:hover{background:var(--surface3);color:var(--text)}
  .reasoning summary svg{width:15px;height:15px;color:var(--accent);animation:spinSlow 4s linear infinite}
  @keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .reasoning[open] summary svg{animation:none;transform:scale(1.1)}
  .reasoning-content{
    color:var(--muted);white-space:pre-wrap;line-height:1.65;
    max-height:320px;overflow-y:auto;font-size:13px;
    padding:0 14px 14px;
    border-top:1px solid var(--line);
    padding-top:10px;
    animation:reasonIn .3s ease;
  }
  @keyframes reasonIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  /* ========== Composer ========== */
  .composer-wrap{
    padding:8px 12px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    flex-shrink:0;position:relative;z-index:2;
  }
  .composer{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding:8px 8px 8px 14px;
    display:flex;flex-direction:column;gap:6px;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    position:relative;
    box-shadow:0 4px 20px rgba(0,0,0,.15);
  }
  .composer::before{
    content:"";position:absolute;inset:-1px;border-radius:25px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent));
    opacity:0;z-index:-1;transition:opacity .3s;
    background-size:200% 200%;
  }
  .composer:focus-within{
    border-color:transparent;
    box-shadow:0 0 0 1px var(--accent), 0 8px 32px rgba(77,107,254,.2);
  }
  .composer:focus-within::before{opacity:.15;animation:gradientShift 3s ease infinite}
  @keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .composer.drag-over{border-color:var(--accent);border-style:dashed;background:rgba(77,107,254,.05)}
  .composer-row{display:flex;align-items:center;gap:6px}
  .composer-input{
    flex:1;resize:none;max-height:180px;
    background:transparent;border:0;color:var(--text);
    font:inherit;font-size:15px;line-height:1.5;
    padding:8px 4px;outline:none;
    transition:height .15s;
  }
  .composer-input::placeholder{color:var(--muted)}
  .composer-btn{
    width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);flex-shrink:0;
    transition:all .2s;
  }
  .composer-btn svg{width:20px;height:20px}
  .composer-btn:hover{background:var(--surface2);color:var(--text);transform:translateY(-1px)}
  .composer-btn:active{background:var(--surface3);transform:scale(.9)}
  .composer-btn.recording{color:var(--danger);background:rgba(240,138,122,.15);animation:pulseMic 1.2s infinite}
  @keyframes pulseMic{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .send-btn{
    width:40px;height:40px;border-radius:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;overflow:hidden;
    box-shadow:0 4px 14px rgba(77,107,254,.35);
  }
  .send-btn::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center, rgba(255,255,255,.4), transparent 70%);
    opacity:0;transition:opacity .3s;
  }
  .send-btn:hover:not(:disabled)::before{opacity:1}
  .send-btn svg{width:18px;height:18px;position:relative;z-index:1;transition:transform .3s}
  .send-btn:hover:not(:disabled) svg{transform:translateX(-3px)}
  .send-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;box-shadow:none}
  .send-btn:not(:disabled):active{transform:scale(.9)}
  .send-btn.stop{background:var(--surface3);color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
  .send-btn.stop::after{
    content:"";position:absolute;inset:-4px;
    border:2px solid var(--danger);border-radius:18px;
    animation:ringPulse 1.5s infinite;
  }
  @keyframes ringPulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

  .composer-features{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .feature-btn{
    background:var(--surface2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:6px 12px;font-size:12px;
    color:var(--text);display:flex;align-items:center;gap:5px;
    transition:all .2s;white-space:nowrap;
  }
  .feature-btn svg{width:13px;height:13px;transition:transform .3s}
  .feature-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .feature-btn:hover svg{transform:rotate(-15deg) scale(1.15)}
  .feature-btn.active{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;border-color:transparent;
    box-shadow:0 2px 10px rgba(77,107,254,.35);
  }
  .feature-btn.active:hover{opacity:.92;transform:translateY(-1px)}

  /* ========== Attachments ========== */
  .attach-preview{
    display:none;gap:8px;padding:4px 2px 8px;
    overflow-x:auto;flex-wrap:nowrap;
    scrollbar-width:thin;
  }
  .attach-preview.show{display:flex;animation:slideDown .3s ease}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .attach-card{
    position:relative;flex:none;width:72px;height:72px;
    border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface2);
    animation:attachIn .3s cubic-bezier(.22,1,.36,1);
    box-shadow:var(--shadow-md);
  }
  @keyframes attachIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  .attach-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .attach-card:hover img{transform:scale(1.08)}
  .attach-card .remove{
    position:absolute;top:4px;right:4px;
    background:rgba(0,0,0,.75);color:#fff;border-radius:50%;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);transition:all .2s;
  }
  .attach-card .remove:hover{background:var(--danger);transform:scale(1.1)}
  .attach-card .remove svg{width:12px;height:12px}

  /* ========== Drawer ========== */
  .drawer-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;
    width:min(88%,360px);
    background:var(--drawer);
    z-index:101;display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    border-inline-start:1px solid var(--line);
    box-shadow:-8px 0 40px rgba(0,0,0,.4);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h3{
    margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .drawer-search{margin:12px 14px;position:relative}
  .drawer-search input{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;font-size:13px;
    padding:11px 40px 11px 14px;transition:all .2s;
  }
  .drawer-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.15)}
  .drawer-search svg{
    position:absolute;top:50%;right:14px;transform:translateY(-50%);
    width:16px;height:16px;color:var(--muted);
    pointer-events:none;
  }
  .drawer-list{flex:1;overflow-y:auto;padding:4px 8px}
  .drawer-group-label{
    font-size:11px;color:var(--muted);padding:12px 14px 6px;
    font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  }
  .drawer-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;border-radius:12px;
    font-size:14px;color:var(--text);
    cursor:pointer;position:relative;
    transition:all .2s;margin-bottom:2px;
    animation:itemIn .3s cubic-bezier(.22,1,.36,1) backwards;
  }
  @keyframes itemIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
  .drawer-item:hover{background:var(--surface2);transform:translateX(-2px)}
  .drawer-item.active{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;box-shadow:0 4px 12px rgba(77,107,254,.3);
  }
  .drawer-item.active .drawer-item-meta{color:rgba(255,255,255,.85)}
  .drawer-item-body{flex:1;overflow:hidden;min-width:0}
  .drawer-item-title{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:14px;font-weight:500;
  }
  .drawer-item-meta{font-size:11px;color:var(--muted);margin-top:3px}
  .drawer-item-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s}
  .drawer-item:hover .drawer-item-actions{opacity:1}
  @media (hover:none){.drawer-item-actions{opacity:.85}}
  .drawer-item-actions button{
    width:28px;height:28px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:inherit;transition:all .2s;
  }
  .drawer-item-actions button svg{width:14px;height:14px}
  .drawer-item-actions button:hover{background:rgba(255,255,255,.15);transform:scale(1.1)}
  .drawer-item.active .drawer-item-actions button:hover{background:rgba(255,255,255,.25)}

  .drawer-footer{
    padding:14px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:12px;font-size:13px;
    background:var(--surface);
  }
  .drawer-footer .avatar{
    width:36px;height:36px;border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;
    box-shadow:0 4px 12px rgba(77,107,254,.3);
  }

  /* ========== Settings Modal ========== */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    z-index:200;display:none;
    align-items:flex-end;justify-content:center;
    animation:fadeIn .25s;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-overlay.open{display:flex}
  .modal{
    width:100%;max-width:600px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:24px 24px 0 0;
    padding:20px;
    padding-bottom:max(20px,env(safe-area-inset-bottom));
    max-height:92dvh;overflow-y:auto;
    animation:slideUp .4s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -20px 60px rgba(0,0,0,.4);
  }
  @keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-.3px}
  .modal p{margin:0 0 12px;color:var(--muted);font-size:12px}
  .modal label{display:block;font-size:12px;margin:14px 0 6px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .modal input[type="text"],.modal input[type="password"],.modal select{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;font-size:14px;
    padding:12px 14px;direction:ltr;text-align:left;
    transition:all .2s;
  }
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.15)}
  .modal textarea{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;font-size:14px;
    padding:12px 14px;direction:rtl;text-align:right;
    min-height:100px;resize:vertical;line-height:1.65;
    transition:all .2s;
  }
  .modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.15)}
  .modal-tabs{
    display:flex;gap:4px;margin-bottom:16px;
    border-bottom:1px solid var(--line);overflow-x:auto;
    scrollbar-width:none;
  }
  .modal-tabs::-webkit-scrollbar{display:none}
  .modal-tab{
    background:transparent;border:0;
    border-bottom:2px solid transparent;
    padding:10px 14px;font-size:13px;color:var(--muted);
    white-space:nowrap;font-weight:500;
    transition:all .2s;position:relative;
  }
  .modal-tab:hover{color:var(--text);background:var(--surface)}
  .modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .modal-tab-content{display:none}
  .modal-tab-content.active{display:block;animation:tabIn .3s ease}
  @keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .switch-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .switch-row:last-child{border:0}
  .switch{position:relative;width:46px;height:26px;flex:none;margin:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:var(--surface3);border-radius:26px;transition:.3s;
  }
  .slider::before{
    content:"";position:absolute;
    height:20px;width:20px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.3s cubic-bezier(.22,1,.36,1);
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .switch input:checked+.slider{background:linear-gradient(135deg, var(--accent), var(--accent-2))}
  .switch input:checked+.slider::before{transform:translateX(20px)}

  .range-row{margin:14px 0}
  .range-row label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;
  }
  .range-row label span{color:var(--accent);font-weight:700;font-size:13px}
  .range-row input[type="range"]{
    width:100%;accent-color:var(--accent);height:6px;
    -webkit-appearance:none;appearance:none;
    background:var(--surface3);border-radius:3px;outline:none;
  }
  .range-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor:pointer;box-shadow:0 2px 8px rgba(77,107,254,.4);
    transition:transform .2s;
  }
  .range-row input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  .range-row input[type="range"]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;border:0;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor:pointer;box-shadow:0 2px 8px rgba(77,107,254,.4);
  }

  .preset-btn{
    display:block;width:100%;text-align:right;
    background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:8px;
    font-size:13px;line-height:1.4;
    transition:all .2s;
  }
  .preset-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .preset-btn:active{transform:translateY(0)}
  .preset-btn strong{color:var(--text);font-weight:600;display:block}
  .preset-btn small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

  .modal-actions{
    display:flex;gap:10px;margin-top:20px;
    position:sticky;bottom:0;background:var(--bg);padding-top:12px;
  }
  .modal-actions button{
    flex:1;height:48px;border-radius:14px;font-size:14px;font-weight:600;
    transition:all .2s;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;box-shadow:0 4px 14px rgba(77,107,254,.35);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(77,107,254,.5)}
  .btn-primary:active{transform:translateY(0)}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .btn-danger{background:linear-gradient(135deg, #f5576c, #f093fb);color:#fff;border:0}

  /* ========== Toast ========== */
  .toast{
    position:fixed;bottom:120px;left:50%;
    transform:translateX(-50%) translateY(20px) scale(.95);
    background:var(--surface3);color:var(--text);
    border:1px solid var(--line);
    padding:12px 22px;border-radius:14px;font-size:13px;
    z-index:300;opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);
    pointer-events:none;max-width:90%;text-align:center;
    box-shadow:var(--shadow-lg);
    font-weight:500;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* ========== Image Viewer ========== */
  .img-viewer{
    position:fixed;inset:0;background:rgba(0,0,0,.96);
    z-index:999;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .3s;padding:20px;
    backdrop-filter:blur(8px);
  }
  .img-viewer.show{opacity:1}
  .img-viewer img{
    max-width:95%;max-height:95%;object-fit:contain;border-radius:16px;
    transform:scale(.95);transition:transform .3s cubic-bezier(.22,1,.36,1);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .img-viewer.show img{transform:scale(1)}
  .img-viewer .close{
    position:absolute;top:24px;right:24px;
    background:rgba(255,255,255,.15);color:#fff;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(10px);
    transition:all .2s;
  }
  .img-viewer .close:hover{background:rgba(255,255,255,.25);transform:rotate(90deg)}

  /* ========== User msg images ========== */
  .msg.user .msg-images{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:6px;margin-top:8px;max-width:300px;
  }
  .msg.user .msg-images.single{grid-template-columns:1fr;max-width:240px}
  .msg-image-wrap{
    border-radius:12px;overflow:hidden;cursor:zoom-in;
    position:relative;aspect-ratio:1;background:rgba(0,0,0,.2);
    transition:transform .2s;
  }
  .msg-image-wrap:hover{transform:scale(1.02)}
  .msg-image-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .msg.user .msg-images.single .msg-image-wrap{aspect-ratio:auto}
  .msg.user .msg-images.single img{height:auto;object-fit:contain}

  /* ========== Scroll-to-bottom button ========== */
  .scroll-down-btn{
    position:fixed;bottom:130px;left:50%;
    transform:translateX(-50%) translateY(20px);
    width:42px;height:42px;border-radius:50%;
    background:var(--surface3);
    border:1px solid var(--line);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    z-index:50;opacity:0;pointer-events:none;
    transition:all .3s cubic-bezier(.22,1,.36,1);
    box-shadow:var(--shadow-lg);
    backdrop-filter:blur(10px);
  }
  .scroll-down-btn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .scroll-down-btn:hover{background:var(--accent);color:#fff;transform:translateX(-50%) translateY(-2px)}
  .scroll-down-btn svg{width:20px;height:20px}

  /* ========== Mic waveform ========== */
  .mic-wave{
    display:none;gap:3px;align-items:center;height:24px;
    padding:0 10px;margin-inline-start:auto;
  }
  .mic-wave.show{display:flex}
  .mic-wave span{
    width:3px;background:var(--danger);border-radius:2px;
    animation:waveAnim 1s infinite ease-in-out;
  }
  .mic-wave span:nth-child(1){animation-delay:0s;height:8px}
  .mic-wave span:nth-child(2){animation-delay:.15s;height:16px}
  .mic-wave span:nth-child(3){animation-delay:.3s;height:20px}
  .mic-wave span:nth-child(4){animation-delay:.45s;height:14px}
  .mic-wave span:nth-child(5){animation-delay:.6s;height:10px}
  @keyframes waveAnim{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  /* ========== Reduced motion ========== */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important;
    }
    .bg-aurora{animation:none}
  }

  /* ========== Mobile adjustments ========== */
  @media (max-width:420px){
    .welcome h1{font-size:22px}
    .welcome-logo{width:80px;height:80px}
    .welcome-actions{grid-template-columns:1fr}
    .msg.user{max-width:90%}
  }
</style>
</head>
<body>

<div class="bg-aurora"></div>
<div class="bg-grid"></div>

<!-- ========== Top Bar ========== -->
<header class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="menuBtn" title="القائمة" aria-label="القائمة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <div class="logo-center" id="logoCenter">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 5.52 4.48 10 10 10 5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
    ROSTO
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="themeBtn" title="الثيم" aria-label="تبديل الثيم">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="icon-btn" id="muteBtn" title="الصوت" aria-label="تفعيل/إلغاء الصوت"></button>
    <button class="icon-btn" id="newChatBtn" title="محادثة جديدة" aria-label="محادثة جديدة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<!-- ========== Chat ========== -->
<main id="chat" role="log" aria-live="polite"></main>

<!-- ========== Scroll down button ========== -->
<button class="scroll-down-btn" id="scrollDownBtn" aria-label="التمرير للأسفل">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
</button>

<!-- ========== Composer ========== -->
<footer class="composer-wrap">
  <div class="attach-preview" id="attachPreview"></div>
  <div class="composer" id="composer">
    <textarea class="composer-input" id="input" rows="1" placeholder="رسالة أو اضغط للتحدث..." aria-label="نص الرسالة"></textarea>
    <div class="composer-row">
      <button class="composer-btn" id="attachBtn" title="إرفاق صورة" aria-label="إرفاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="composer-btn" id="micBtn" title="إدخال صوتي" aria-label="الميكروفون">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="mic-wave" id="micWave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div style="flex:1"></div>
      <button class="feature-btn" id="searchWebBtn" title="بحث ويب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>
        </svg>
        <span>بحث</span>
      </button>
      <button class="feature-btn" id="thinkBtn" title="تفكير عميق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2z"/>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2z"/>
        </svg>
        <span>تفكير</span>
      </button>
      <button class="send-btn" id="sendBtn" disabled aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<!-- ========== Hidden file input (FIXED) ========== -->
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<!-- ========== Drawer ========== -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="المحادثات">
  <div class="drawer-head">
    <h3>ROSTO</h3>
    <button class="icon-btn" id="closeDrawer" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="drawerSearch" placeholder="ابحث في المحادثات..." aria-label="بحث">
  </div>

/* ============ IndexedDB & crypto ============ */
const idb = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("rosto_v3", 1);
      r.onupgradeneeded = () => {
        if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("kv").objectStore("kv").get(k);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
      });
    } catch { return null; }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction("kv", "readwrite");
        t.objectStore("kv").put(v, k);
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    } catch {}
  },
  async clear() {
    try {
      const db = await this.open();
      return new Promise((res) => {
        const t = db.transaction("kv", "readwrite");
        t.objectStore("kv").clear();
        t.oncomplete = () => res();
        t.onerror = () => res();
      });
    } catch {}
  }
};

const b64 = {
  enc(u8) { let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); },
  dec(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
};

async function getDeviceKey() {
  let k = await idb.get("devkey");
  if (!k) {
    k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    await idb.set("devkey", k);
  }
  return k;
}
async function saveSecureKey(plain) {
  if (!plain) { store.del("rosto_key_v3"); store.del("rosto_key_v2"); store.del("rosto_key"); return; }
  try {
    const key = await getDeviceKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain));
    store.set("rosto_key_v3", b64.enc(iv) + "." + b64.enc(new Uint8Array(ct)));
    store.del("rosto_key_v2"); store.del("rosto_key");
  } catch (e) { console.warn("Encrypt failed:", e); }
}
async function loadSecureKey() {
  const v3 = store.get("rosto_key_v3");
  if (v3) {
    try {
      const [iv, ct] = v3.split(".").map(b64.dec);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await getDeviceKey(), ct);
      return new TextDecoder().decode(pt);
    } catch { return ""; }
  }
  const v2 = store.get("rosto_key_v2");
  if (v2) {
    try {
      const [iv, ct] = v2.split(".").map(b64.dec);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await getDeviceKey(), ct);
      const val = new TextDecoder().decode(pt);
      await saveSecureKey(val);
      return val;
    } catch { return ""; }
  }
  const plain = store.get("rosto_key", "");
  if (plain) { await saveSecureKey(plain); return plain; }
  return "";
}

/* ============ Fetch with retry ============ */
function abortable(promise, ctl) {
  if (!ctl) return promise;
  return new Promise((res, rej) => {
    const onAbort = () => rej(new DOMException("aborted", "AbortError"));
    if (ctl.signal.aborted) return onAbort();
    ctl.signal.addEventListener("abort", onAbort, { once: true });
    promise.then(
      v => { ctl.signal.removeEventListener("abort", onAbort); res(v); },
      e => { ctl.signal.removeEventListener("abort", onAbort); rej(e); }
    );
  });
}

async function fetchRetry(url, opts, maxRetries = 3, ctl = null) {
  for (let i = 0; i <= maxRetries; i++) {
    try {
      const res = await abortable(fetch(url, opts), ctl);
      if (res.ok || res.status < 500 && res.status !== 429) return res;
      if (i === maxRetries) return res;
      await abortable(new Promise(r => setTimeout(r, 800 * Math.pow(2, i))), ctl);
    } catch (e) {
      if (e.name === "AbortError") throw e;
      if (i === maxRetries) throw e;
      await abortable(new Promise(r => setTimeout(r, 800 * Math.pow(2, i))), ctl);
    }
  }
}

/* ============ Markdown ============ */
if (window.marked) marked.setOptions({ breaks: true, gfm: true });

function renderSimple(text) {
  const parts = String(text).split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      const m = part.match(/^([a-zA-Z0-9+#_-]*)\n([\s\S]*?)\n?$/);
      const lang = m ? m[1] : "";
      const code = m ? m[2] : part;
      return `<pre><code class="language-${esc(lang)}">${esc(code)}</code><button class="copy-code" onclick="copyCode(this)">نسخ</button></pre>`;
    }
    let h = esc(part);
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    return h.replace(/\n/g, "<br>");
  }).join("");
}

function render(text) {
  if (!window.marked || !window.DOMPurify) return renderSimple(text);
  try {
    const clean = DOMPurify.sanitize(marked.parse(String(text)), {
      FORBID_TAGS: ["style", "form", "img", "iframe", "object", "embed", "input", "button", "script"],
      FORBID_ATTR: ["style", "onclick", "onerror", "onload"],
      ADD_ATTR: ["target"]
    });
    const tmp = document.createElement("div");
    tmp.innerHTML = clean;
    tmp.querySelectorAll("a[href]").forEach(a => {
      a.target = "_blank";
      a.rel = "noopener noreferrer nofollow";
    });
    tmp.querySelectorAll("pre code").forEach(el => {
      try {
        if (window.hljs && !el.dataset.hl) {
          window.hljs.highlightElement(el);
          el.dataset.hl = "1";
        }
      } catch {}
      const btn = document.createElement("button");
      btn.className = "copy-code";
      btn.textContent = "نسخ";
      btn.setAttribute("onclick", "copyCode(this)");
      el.parentElement.appendChild(btn);
    });
    return tmp.innerHTML;
  } catch (e) {
    console.warn("Render failed:", e);
    return renderSimple(text);
  }
}

window.copyCode = function(btn) {
  const codeEl = btn.parentElement.querySelector("code");
  if (!codeEl) return;
  const code = codeEl.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "✓ تم";
    setTimeout(() => btn.textContent = "نسخ", 1500);
  }).catch(() => toast("فشل النسخ"));
};

function mkBtn(iconHtml, onclick, title = "") {
  const b = document.createElement("button");
  b.innerHTML = iconHtml;
  if (title) b.title = title;
  b.onclick = onclick;
  return b;
}

/* ============ Actions ============ */
function addUserActions(el, idx) {
  const a = document.createElement("div");
  a.className = "msg-actions";
  a.append(
    mkBtn(ICON.edit, () => editMessage(idx, el), "تعديل"),
    mkBtn(ICON.copy, () => {
      navigator.clipboard.writeText(msgText(messages[idx]))
        .then(() => toast("✓ تم النسخ"))
        .catch(() => toast("فشل النسخ"));
    }, "نسخ"),
    mkBtn(ICON.trash, () => deleteMessage(idx), "حذف")
  );
  el.appendChild(a);
}

function addAssistantActions(el, text, idx) {
  const a = document.createElement("div");
  a.className = "msg-actions";
  a.append(
    mkBtn(ICON.copy, () => {
      navigator.clipboard.writeText(text)
        .then(() => toast("✓ تم النسخ"))
        .catch(() => toast("فشل النسخ"));
    }, "نسخ"),
    mkBtn(ICON.speaker, () => speak(text), "نطق")
  );
  if (idx === messages.length - 1) {
    a.append(mkBtn(ICON.refresh, () => regenerate(idx), "إعادة توليد"));
  }
  const usage = messages[idx]?.usage;
  if (usage?.t) {
    const badge = document.createElement("span");
    badge.className = "usage-badge";
    badge.textContent = `${usage.t} tokens`;
    badge.title = `Prompt: ${usage.p || "?"} | Completion: ${usage.c || "?"}`;
    a.appendChild(badge);
  }
  a.append(mkBtn(ICON.trash, () => deleteMessage(idx), "حذف"));
  el.appendChild(a);
}

function deleteMessage(idx) {
  if (controller) return toast("⏳ انتظر انتهاء الرد");
  if (!messages[idx]) return;
  messages.splice(idx, 1);
  saveChat();
  restore();
}

function regenerate(idx) {
  if (controller) return;
  if (messages[idx]?.role !== "assistant" || idx !== messages.length - 1) return;
  const prevUserIdx = idx - 1;
  const userMsg = messages[prevUserIdx];
  if (!userMsg || userMsg.role !== "user") return;
  messages.splice(idx, 1);
  saveChat();
  restore();
  resendFrom(userMsg);
}

function resendFrom(userMsg) {
  const text = msgText(userMsg);
  const imgs = msgImgs(userMsg);
  attachments = imgs.map((url, i) => ({ dataUrl: url, name: "img" + (i + 1) }));
  renderAttachPreview();
  // Remove the old user message so we can re-add it fresh
  const lastIdx = messages.lastIndexOf(userMsg);
  if (lastIdx >= 0) messages.splice(lastIdx, 1);
  restore();
  send(text);
}

function editMessage(idx, el) {
  if (controller) return toast("⏳ انتظر");
  const m = messages[idx];
  if (!m) return;
  el.innerHTML = "";
  const ta = document.createElement("textarea");
  ta.className = "composer-input";
  ta.style.width = "100%";
  ta.style.background = "var(--surface)";
  ta.style.border = "1px solid var(--line)";
  ta.style.borderRadius = "12px";
  ta.style.padding = "10px";
  ta.style.color = "var(--text)";
  ta.style.font = "inherit";
  ta.value = msgText(m);
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:6px;margin-top:8px";
  const ok = document.createElement("button");
  ok.textContent = "💾 حفظ وإرسال";
  ok.style.cssText = "background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600";
  ok.onclick = () => {
    const t = ta.value.trim();
    if (!t && !msgImgs(m).length) return toast("لا يوجد نص");
    const newMsg = { ...m, content: msgImgs(m).length
      ? [{ type: "text", text: t || "حلل الصورة" }, ...msgImgs(m).map(u => ({ type: "image_url", image_url: { url: u } }))]
      : t
    };
    messages.splice(idx);
    saveChat();
    restore();
    resendFrom(newMsg);
  };
  const cancel = document.createElement("button");
  cancel.textContent = "✕ إلغاء";
  cancel.style.cssText = "background:var(--surface2);color:var(--text);padding:8px 14px;border-radius:10px;font-size:13px;border:1px solid var(--line)";
  cancel.onclick = () => restore();
  row.append(ok, cancel);
  el.append(ta, row);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

/* ============ Render messages ============ */
function renderUserMsg(text, imgs = []) {
  const el = document.createElement("div");
  el.className = "msg user";
  if (text) {
    const p = document.createElement("div");
    p.textContent = text;
    el.appendChild(p);
  }
  if (imgs.length) {
    const g = document.createElement("div");
    g.className = "msg-images" + (imgs.length === 1 ? " single" : "");
    imgs.forEach(a => {
      const w = document.createElement("div");
      w.className = "msg-image-wrap";
      const im = document.createElement("img");
      im.src = a.dataUrl;
      im.loading = "lazy";
      im.alt = "صورة";
      w.appendChild(im);
      w.onclick = () => openImageViewer(a.dataUrl);
      g.appendChild(w);
    });
    el.appendChild(g);
  }
  chat.appendChild(el);
  scrollDown();
  return el;
}

function drawMessage(m, idx) {
  const text = msgText(m);
  let el;
  if (m.role === "user") {
    el = renderUserMsg(text, msgImgs(m).map(u => ({ dataUrl: u })));
    addUserActions(el, idx);
  } else {
    const sp = splitThink(text);
    const think = m.reasoning || sp.think;
    const body = sp.body || text;
    el = document.createElement("div");
    el.className = "msg assistant";
    if (think && reasoningEnabled) {
      el.innerHTML = '<details class="reasoning"><summary>' + ICON.brain + ' تفكير الموديل</summary><div class="reasoning-content"></div></details>';
      el.querySelector(".reasoning-content").textContent = think;
    }
    const c = document.createElement("div");
    c.innerHTML = render(body);
    el.appendChild(c);
    chat.appendChild(el);
    addAssistantActions(el, body, idx);
  }
  el.dataset.idx = idx;
  return el;
}

/* ============ Storage ============ */
function sanitizeForStorage(m) {
  const out = { role: m.role, content: m.content };
  if (m.usage) out.usage = m.usage;
  if (m.reasoning) out.reasoning = m.reasoning;
  return out;
}

function saveChat() {
  const sid = Sessions.current();
  const cur = Sessions.all()[sid];
  if (!cur) return;
  const toSave = messages.filter(m => m && m.content).slice(-80).map(sanitizeForStorage);
  const first = messages.find(m => m && m.role === "user");
  const title = msgText(first).replace(/\s+/g, " ").trim().slice(0, 40) || "محادثة جديدة";
  Sessions.update(sid, { messages: toSave, name: title });
}

/* ============ UI State ============ */
function setBusy(b) {
  sendBtn.classList.toggle("stop", b);
  const hasContent = input.value.trim() || attachments.length;
  sendBtn.disabled = !b && !hasContent;
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  setBusy(!!controller);
}

/* ============ Speech ============ */
function speak(text) {
  if (!("speechSynthesis" in window)) return toast("النطق غير مدعوم");
  window.speechSynthesis.cancel();
  const clean = String(text)
    .replace(/```[\s\S]*?```/g, " كود ")
    .replace(/[`*#_>]/g, "")
    .slice(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ar-SA";
  u.rate = 1;
  const voices = window.speechSynthesis.getVoices();
  const arVoice = voices.find(v => v.lang.startsWith("ar"));
  if (arVoice) u.voice = arVoice;
  window.speechSynthesis.speak(u);
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "ar-EG";
  r.continuous = false;
  r.interimResults = true;
  r.onresult = (e) => {
    let t = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      t += e.results[i][0].transcript;
    }
    input.value = t;
    autoGrow();
  };
  r.onerror = (e) => {
    console.warn("Speech error:", e.error);
    if (e.error === "not-allowed") toast("❌ منع الميكروفون");
    stopRecording();
  };
  r.onend = () => stopRecording();
  return r;
}

function startRecording() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return toast("الصوت غير مدعوم في متصفحك");
  try {
    recognition.start();
    isRecording = true;
    $("micBtn").classList.add("recording");
    $("micWave").classList.add("show");
  } catch {
    toast("الميكروفون مشغول");
  }
}

function stopRecording() {
  isRecording = false;
  $("micBtn").classList.remove("recording");
  $("micWave").classList.remove("show");
  if (recognition) try { recognition.stop(); } catch {}
}

/* ============ Image handling ============ */
async function compressImage(file, maxDim = 1280, quality = imgQuality / 100) {
  if (!compressOn) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = (e) => res(e.target.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const r = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * r);
        height = Math.round(height * r);
      }
      const c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      rej(new Error("bad image"));
    };
    img.src = url;
  });
}

async function attachImages(files) {
  const arr = [...files].filter(f => f.type.startsWith("image/"));
  if (!arr.length) return;
  for (const f of arr) {
    if (attachments.length >= MAX_IMAGES) {
      toast("الحد الأقصى " + MAX_IMAGES + " صور");
      break;
    }
    try {
      const dataUrl = await compressImage(f);
      attachments.push({ dataUrl, name: f.name || "image" });
    } catch (e) {
      console.warn("Image load failed:", e);
      toast("فشل تحميل صورة");
    }
  }
  renderAttachPreview();
  autoGrow();
}

function renderAttachPreview() {
  const box = $("attachPreview");
  if (!attachments.length) {
    box.classList.remove("show");
    box.innerHTML = "";
    return;
  }
  box.classList.add("show");
  box.innerHTML = "";
  attachments.forEach((a, i) => {
    const c = document.createElement("div");
    c.className = "attach-card";
    const im = document.createElement("img");
    im.src = a.dataUrl;
    im.alt = a.name;
    const rm = document.createElement("button");
    rm.className = "remove";
    rm.setAttribute("aria-label", "إزالة");
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    rm.onclick = (e) => {
      e.stopPropagation();
      attachments.splice(i, 1);
      renderAttachPreview();
      autoGrow();
    };
    c.append(im, rm);
    box.appendChild(c);
  });
}

/* ============ Prepare history ============ */
function prepareHistory() {
  const h = messages.slice(-maxHistory);
  // Only keep images in the last user message to save tokens
  let lastImgIdx = -1;
  for (let i = h.length - 1; i >= 0; i--) {
    if (Array.isArray(h[i].content) && h[i].content.some(c => c.type === "image_url")) {
      lastImgIdx = i;
      break;
    }
  }
  return h.map((m, i) => {
    if (Array.isArray(m.content) && i !== lastImgIdx) {
      const txt = msgText(m) + " [صورة]";
      return { role: m.role, content: txt };
    }
    return { role: m.role, content: m.content };
  });
}

/* ============ Send ============ */
async function send(raw) {
  if (controller) return;
  const text = (raw || "").trim();
  if (!text && !attachments.length) return;
  if (!apiKey) {
    openSettings();
    return toast("⚠️ أضف مفتاح Groq أولاً");
  }

  messages = messages.filter(m => m && m.content);
  const needsVision = attachments.length > 0;
  let useModel = model;
  if (needsVision && !isVisionModel(model)) {
    if (!autoVision) {
      attachments = [];
      renderAttachPreview();
      return toast("⚠️ الموديل الحالي لا يدعم الصور");
    }
    useModel = VISION_FALLBACK;
    toast("🖼 تم التبديل لموديل الرؤية");
  }

  const imgs = attachments.slice();
  const userContent = imgs.length
    ? [{ type: "text", text: text || "حلل هذه الصورة" }, ...imgs.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } }))]
    : text;

  if (!messages.length) chat.innerHTML = "";
  messages.push({ role: "user", content: userContent });
  drawMessage(messages[messages.length - 1], messages.length - 1);

  attachments = [];
  renderAttachPreview();
  input.value = "";
  autoGrow();
  scrollAuto = true;

  const el = document.createElement("div");
  el.className = "msg assistant";
  const rBox = document.createElement("div");
  const cBox = document.createElement("div");
  cBox.appendChild(typingAnim());
  el.append(rBox, cBox);
  chat.appendChild(el);
  scrollDown(true);

  setBusy(true);
  controller = new AbortController();
  const ctl = controller;
  let partial = "";
  let reasoningBuf = "";
  let usage = null;

  const paint = () => {
    const sp = splitThink(partial);
    const rt = reasoningBuf || sp.think;
    if (rt && reasoningEnabled) {
      if (!rBox.firstChild) {
        rBox.innerHTML = '<details class="reasoning"><summary>' + ICON.brain + ' تفكير الموديل</summary><div class="reasoning-content"></div></details>';
      }
      const rc = rBox.querySelector(".reasoning-content");
      if (rc) rc.textContent = rt;
    }
    if (sp.body) {
      cBox.innerHTML = render(sp.body);
    }
    scrollDown();
  };

  const fail = (msg) => {
    // Roll back
    const last = messages[messages.length - 1];
    if (last && last.role === "user") messages.pop();
    input.value = text;
    autoGrow();
    if (imgs.length) {
      attachments = imgs;
      renderAttachPreview();
    }
    restore();
    const e = document.createElement("div");
    e.className = "msg assistant err";
    e.textContent = "⚠️ " + msg;
    chat.appendChild(e);
    scrollDown();
  };

  let finalSystem = systemPrompt || "";
  if (useSearch) finalSystem += "\n\n[ملاحظة: استخدم أحدث المعلومات المتاحة لديك]";
  if (useThink) finalSystem += "\n\n[ملاحظة: فكر خطوة بخطوة قبل الإجابة النهائية]";

  const body = {
    model: useModel,
    messages: finalSystem
      ? [{ role: "system", content: finalSystem.trim() }, ...prepareHistory()]
      : prepareHistory(),
    max_tokens: maxTokens,
    temperature,
    top_p: topP,
    stream: streamEnabled
  };
  if (REASONING_MODELS.test(useModel)) body.reasoning_format = "parsed";

  try {
    const opts = {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body),
      signal: ctl.signal
    };

    const res = await fetchRetry(API_URL, opts, 3, ctl);

    if (!res.ok) {
      let detail = "";
      try {
        const j = await abortable(res.json(), ctl);
        detail = j.error?.message || j.message || "";
      } catch {}
      return fail("خطأ " + res.status + (detail ? ": " + detail : ""));
    }

    if (!streamEnabled) {
      const data = await abortable(res.json(), ctl);
      const msg = data.choices?.[0]?.message || {};
      partial = msg.content || "";
      reasoningBuf = msg.reasoning || msg.reasoning_content || "";
      usage = data.usage;
      paint();
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await abortable(reader.read(), ctl);
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          let json;
          try { json = JSON.parse(data); } catch { continue; }
          usage = json.x_groq?.usage || json.usage || usage;
          const ch = json.choices?.[0];
          if (!ch) continue;
          const d = ch.delta;
          if (!d) continue;
          let changed = false;
          const rs = d.reasoning_content ?? d.reasoning;
          if (rs) { reasoningBuf += rs; changed = true; }
          if (d.content) { partial += d.content; changed = true; }
          if (changed) paint();
        }
      }
    }

    const sp = splitThink(partial);
    const finalText = sp.body || partial;
    if (!finalText.trim()) return fail("لم يصل رد من الموديل");

    el.remove();
    const msg = { role: "assistant", content: finalText };
    if (reasoningBuf || sp.think) msg.reasoning = reasoningBuf || sp.think;
    if (usage?.total_tokens) {
      msg.usage = {
        p: usage.prompt_tokens,
        c: usage.completion_tokens,
        t: usage.total_tokens
      };
    }
    messages.push(msg);
    drawMessage(msg, messages.length - 1);
    restore();
    saveChat();
    if (ttsEnabled) speak(finalText);
  } catch (e) {
    if (e.name === "AbortError") {
      const sp = splitThink(partial);
      const finalText = sp.body || partial;
      if (finalText.trim()) {
        const msg = { role: "assistant", content: finalText };
        if (reasoningBuf || sp.think) msg.reasoning = reasoningBuf || sp.think;
        messages.push(msg);
        saveChat();
      }
      restore();
      toast("⏹ تم الإيقاف");
    } else {
      console.error(e);
      fail("مشكلة في الاتصال: " + (e.message || e.name || "unknown"));
    }
  } finally {
    controller = null;
    setBusy(false);
  }
}

/* ============ Image viewer ============ */
function openImageViewer(src) {
  const o = document.createElement("div");
  o.className = "img-viewer";
  const close = document.createElement("button");
  close.className = "close";
  close.setAttribute("aria-label", "إغلاق");
  close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px;height:22px"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const im = document.createElement("img");
  im.src = src;
  o.append(close, im);
  o.onclick = (e) => {
    if (e.target === o || e.target === close) o.remove();
  };
  document.addEventListener("keydown", function esc2(e) {
    if (e.key === "Escape") { o.remove(); document.removeEventListener("keydown", esc2); }
  });
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add("show"));
}

/* ============ Theme ============ */
function applyTheme() {
  let theme = themePref;
  if (themePref === "auto") {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.body.setAttribute("data-theme", theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#FAFAFB" : "#0A0A0A");
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (themePref === "auto") applyTheme();
});

function updateMuteIcon() {
  $("muteBtn").innerHTML = ttsEnabled ? ICON.speaker : ICON.speakerOff;
}

/* ============ Drawer ============ */
function openDrawer() {
  $("drawer").classList.add("open");
  $("drawerOverlay").classList.add("open");
  drawDrawer();
}
function closeDrawer() {
  $("drawer").classList.remove("open");
  $("drawerOverlay").classList.remove("open");
}

function drawDrawer() {
  const list = $("drawerList");
  list.innerHTML = "";
  const current = Sessions.current();
  const sessions = Sessions.list();
  if (!sessions.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:24px;font-size:13px">لا توجد محادثات</p>';
    return;
  }
  const groups = {};
  sessions.forEach(s => {
    const d = new Date(s.updatedAt);
    const today = new Date();
    const diff = Math.floor((today - d) / 86400000);
    let label;
    if (diff === 0) label = "اليوم";
    else if (diff === 1) label = "أمس";
    else if (diff < 7) label = "آخر أسبوع";
    else if (diff < 30) label = "آخر شهر";
    else label = d.toLocaleDateString("ar-EG", { month: "long", year: "numeric" });
    if (!groups[label]) groups[label] = [];
    groups[label].push(s);
  });
  Object.entries(groups).forEach(([label, items]) => {
    const gl = document.createElement("div");
    gl.className = "drawer-group-label";
    gl.textContent = label;
    list.appendChild(gl);
    items.forEach(s => {
      const item = document.createElement("div");
      item.className = "drawer-item" + (s.id === current ? " active" : "");
      item.innerHTML = `
        <div class="drawer-item-body">
          <div class="drawer-item-title">${esc(s.name)}</div>
          <div class="drawer-item-meta">${(s.messages || []).length} رسالة</div>
        </div>
        <div class="drawer-item-actions">
          <button data-act="del" title="حذف" aria-label="حذف">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>`;
      item.onclick = (e) => {
        if (e.target.closest("[data-act]")) {
          e.stopPropagation();
          if (confirm("حذف هذه المحادثة؟")) {
            Sessions.delete(s.id);
            if (s.id === current) {
              messages = Sessions.all()[Sessions.current()]?.messages || [];
              restore();
            }
            drawDrawer();
          }
          return;
        }
        if (s.id === current) { closeDrawer(); return; }
        if (messages.length) saveChat();
        Sessions.load(s.id);
        closeDrawer();
      };
      list.appendChild(item);
    });
  });
}

  $("maxTokRange").value = maxTokens;
  $("maxTokVal").textContent = maxTokens;

  $("topPVal").textContent = topP;

};

$("newChatBtn").onclick = () => {
  if (messages.length) saveChat();
  Sessions.create();
  messages = [];

$("drawerSearch").oninput = (e) => {
  const q = e.target.value.trim().toLowerCase();
  const list = $("drawerList");
  if (!q) return drawDrawer();
  const sessions = Sessions.list().filter(s =>
    s.name.toLowerCase().includes(q) ||
    (s.messages || []).some(m => msgText(m).toLowerCase().includes(q))
  );
  list.innerHTML = "";
  if (!sessions.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:24px;font-size:13px">لا توجد نتائج</p>';
    return;
  }
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = "drawer-item";
    item.innerHTML = `<div class="drawer-item-body"><div class="drawer-item-title">${esc(s.name)}</div><div class="drawer-item-meta">${(s.messages || []).length} رسالة</div></div>`;
    item.onclick = () => {
      if (messages.length) saveChat();
      Sessions.load(s.id);
      closeDrawer();
      $("drawerSearch").value = "";
    };
    list.appendChild(item);
  });
};

$("openSettings").onclick = () => { closeDrawer(); openSettings(); };
$("closeSettings").onclick = closeSettings;
$("settings").onclick = (e) => { if (e.target.id === "settings") closeSettings(); };

$("saveSettings").onclick = async () => {
  const nk = $("keyInput").value.trim();
  if (nk !== apiKey) {
    await saveSecureKey(nk);
    apiKey = nk;
  }
  const customModel = $("modelInput").value.trim();
  model = customModel || $("modelSelect").value;
  systemPrompt = $("systemInput").value.trim();
  autoVision = $("autoVisionToggle").checked;
  compressOn = $("compressToggle").checked;
  ttsEnabled = $("ttsToggle").checked;
  streamEnabled = $("streamToggle").checked;
  reasoningEnabled = $("reasoningToggle").checked;
  temperature = parseFloat($("tempRange").value);
  maxTokens = parseInt($("maxTokRange").value);
  topP = parseFloat($("topPRange").value);
  maxHistory = parseInt($("histRange").value);
  imgQuality = parseInt($("imgQRange").value);

  store.set("rosto_model", model);
  store.set("rosto_system", systemPrompt);
  store.set("rosto_autovision", autoVision ? "1" : "0");
  store.set("rosto_compress", compressOn ? "1" : "0");
  store.set("rosto_tts", ttsEnabled ? "1" : "0");
  store.set("rosto_stream", streamEnabled ? "1" : "0");
  store.set("rosto_reasoning", reasoningEnabled ? "1" : "0");
  store.set("rosto_temp", temperature);
  store.set("rosto_maxtok", maxTokens);
  store.set("rosto_topp", topP);
  store.set("rosto_hist", maxHistory);
  store.set("rosto_imgq", imgQuality);

  updateMuteIcon();
  closeSettings();
  toast("✓ تم الحفظ");
  if (nk) loadModels();
};

$$(".modal-tab").forEach(tab => {
  tab.onclick = () => {
    $$(".modal-tab").forEach(t => t.classList.remove("active"));
    $$(".modal-tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    const content = $(tab.dataset.tab);
    if (content) content.classList.add("active");
  };
});

[["temp", "tempRange"], ["maxTok", "maxTokRange"], ["topP", "topPRange"], ["hist", "histRange"], ["imgQ", "imgQRange"]]
  .forEach(([k, id]) => {
    const el = $(id);
    if (el) el.oninput = (e) => { $(k + "Val").textContent = e.target.value; };
  });

$$("[data-theme]").forEach(b => {
  b.onclick = () => {
    themePref = b.dataset.theme;
    store.set("rosto_theme", themePref);
    applyTheme();
    toast("✓ تم تطبيق الثيم");
  };
});

$("reloadModels").onclick = async () => {
  if (!apiKey) return toast("⚠️ أضف المفتاح أولاً");
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const { data } = await r.json();
    const list = (data || [])
      .filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id))
      .sort((a, b) => a.id.localeCompare(b.id));
    const sel = $("modelSelect");
    sel.innerHTML = "";
    list.forEach(m => {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.id;
      sel.appendChild(o);
    });
    toast(`✓ ${list.length} موديل متاح`);
  } catch (e) {
    toast("❌ فشل: " + e.message);
  }
};

$("exportChatBtn").onclick = () => {
  if (!messages.length) return toast("لا توجد رسائل");
  const t = messages.map(m =>
    `${m.role === "user" ? "👤 أنت" : "🐋 ROSTO"}:\n${msgText(m)}`
  ).join("\n\n" + "─".repeat(50) + "\n\n");
  download(t, "text/plain;charset=utf-8", `rosto-chat-${Date.now()}.txt`);
  toast("✓ تم التصدير");
};

$("exportAllBtn").onclick = () => {
  const d = {
    version: 3,
    date: new Date().toISOString(),
    sessions: Sessions.all(),
    current: Sessions.current(),
    settings: {
      model, systemPrompt, ttsEnabled, streamEnabled,
      autoVision, compressOn, reasoningEnabled, themePref,
      temperature, maxTokens, topP, maxHistory, imgQuality
    }
  };
  download(JSON.stringify(d, null, 2), "application/json", `rosto-backup-${Date.now()}.json`);
  toast("✓ تم إنشاء النسخة");
};

$("restoreAllBtn").onclick = () => $("restoreFile").click();

$("restoreFile").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.sessions) throw new Error("ملف غير صالح");
    if (!confirm("⚠️ سيتم استبدال كل البيانات الحالية. متأكد؟")) {
      e.target.value = "";
      return;
    }
    Sessions.save(d.sessions);
    if (d.current) store.set(Sessions.CURRENT, d.current);
    if (d.settings) {
      Object.entries(d.settings).forEach(([k, v]) => {
        const map = {
          model: "rosto_model", systemPrompt: "rosto_system",
          ttsEnabled: "rosto_tts", streamEnabled: "rosto_stream",
          autoVision: "rosto_autovision", compressOn: "rosto_compress",
          reasoningEnabled: "rosto_reasoning", themePref: "rosto_theme",
          temperature: "rosto_temp", maxTokens: "rosto_maxtok",
          topP: "rosto_topp", maxHistory: "rosto_hist", imgQuality: "rosto_imgq"
        };
        if (map[k]) {
          const val = typeof v === "boolean" ? (v ? "1" : "0") : String(v);
          store.set(map[k], val);
        }
      });
    }
    toast("✓ تمت الاستعادة... جاري التحديث");
    setTimeout(() => location.reload(), 1000);
  } catch (err) {
    toast("❌ فشل: " + err.message);
  }
  e.target.value = "";
};

$("clearAllBtn").onclick = () => {
  if (!confirm("⚠️ سيتم مسح كل شيء نهائياً. متأكد؟")) return;
  if (!confirm("🔴 تأكيد أخير: لا يمكن التراجع!")) return;
  Object.keys(localStorage)
    .filter(k => k.startsWith("rosto_"))
    .forEach(k => localStorage.removeItem(k));
  idb.clear().finally(() => location.reload());
};

function download(content, mime, name) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadModels() {
  if (!apiKey) return;
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    if (!r.ok) return;
    const { data } = await r.json();
    const list = (data || []).filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id));
    const sel = $("modelSelect");
    if (list.length) {
      sel.innerHTML = "";
      list.sort((a, b) => a.id.localeCompare(b.id)).forEach(m => {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = m.id;
        sel.appendChild(o);
      });
      if ([...sel.options].some(o => o.value === model)) {
        sel.value = model;
      } else {
        const o = document.createElement("option");
        o.value = model;
        o.textContent = model + " (مخصص)";
        sel.appendChild(o);
        sel.value = model;
      }
    }
  } catch (e) {
    console.warn("loadModels:", e);
  }
}

/* ============ Composer events ============ */
$("micBtn").onclick = () => isRecording ? stopRecording() : startRecording();
$("attachBtn").onclick = () => fileInput.click();
fileInput.onchange = async (e) => {
  await attachImages(e.target.files);
  e.target.value = "";
};

$("searchWebBtn").onclick = () => {
