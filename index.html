<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROSTO">
<title>ROSTO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<style>
  :root {
    --bg:#0A0A0A;
    --surface:#141414;
    --surface2:#1C1C1C;
    --surface3:#252525;
    --line:#2A2A2A;
    --text:#ECECEC;
    --muted:#8A8A8A;
    --accent:#4D6BFE;
    --accent-ink:#FFFFFF;
    --accent-hover:#3D5BEE;
    --danger:#F08A7A;
    --code-bg:#0D0D0D;
    --hdr:rgba(10,10,10,0.95);
    --cmp:rgba(10,10,10,0.98);
    --drawer:rgba(10,10,10,0.98);
  }
  [data-theme="light"]{
    --bg:#FFFFFF;--surface:#F7F7F8;--surface2:#EFEFEF;--surface3:#E5E5E5;--line:#E0E0E0;
    --text:#1A1A1A;--muted:#6B6B6B;--accent:#4D6BFE;--accent-ink:#FFFFFF;--accent-hover:#3D5BEE;
    --code-bg:#F0F0F0;--hdr:rgba(255,255,255,0.95);--cmp:rgba(255,255,255,0.98);--drawer:rgba(255,255,255,0.98);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
    font-size:15px;line-height:1.7;
    display:flex;flex-direction:column;height:100dvh;
    transition:background .3s ease,color .3s ease;
  }
  button{font:inherit;color:inherit;cursor:pointer;transition:all .15s ease;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ========== Top Bar ========== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
    background:var(--bg);position:relative;z-index:5;flex-shrink:0;
    min-height:52px;
  }
  .topbar-left,.topbar-right{display:flex;align-items:center;gap:4px}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);flex-shrink:0;
  }
  .icon-btn svg{width:22px;height:22px}
  .icon-btn:hover{background:var(--surface2)}
  .icon-btn:active{background:var(--surface3);transform:scale(.92)}
  .logo-badge{
    display:flex;align-items:center;gap:8px;
    font-weight:600;font-size:17px;color:var(--text);
  }
  .logo-badge svg{width:28px;height:28px;color:var(--accent)}

  /* ========== Chat ========== */
  #chat{
    flex:1;overflow-y:auto;padding:16px 12px 8px;
    display:flex;flex-direction:column;gap:20px;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  }
  #chat::-webkit-scrollbar{width:6px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .msg{max-width:100%;word-wrap:break-word;overflow-wrap:anywhere;animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .msg.user{
    align-self:flex-end;max-width:85%;
    background:var(--accent);color:#fff;
    padding:9px 14px;border-radius:18px 18px 4px 18px;
    font-size:15px;line-height:1.6;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .msg.assistant{align-self:stretch;padding:0 4px;color:var(--text)}
  .msg.err{color:var(--danger);font-size:14px}

  .msg code{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:.88em;background:var(--surface2);
    padding:2px 6px;border-radius:5px;direction:ltr;unicode-bidi:embed;
    color:#E8B84B;
  }
  .msg pre{
    direction:ltr;text-align:left;background:var(--code-bg);
    border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin:10px 0;overflow-x:auto;
    line-height:1.5;position:relative;font-size:13px;
  }
  .msg pre code{background:none;padding:0;font-size:13px;color:var(--text)}
  .msg pre .copy-code{
    position:absolute;top:8px;right:8px;
    background:var(--surface2);border:1px solid var(--line);
    border-radius:6px;padding:3px 10px;font-size:11px;
    color:var(--muted);font-family:inherit;
  }
  .msg pre .copy-code:hover{color:var(--accent);border-color:var(--accent)}
  .msg table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px;display:block;overflow-x:auto}
  .msg table th,.msg table td{border:1px solid var(--line);padding:6px 10px}
  .msg table th{background:var(--surface2);font-weight:600}
  .msg ul,.msg ol{padding-inline-start:22px;margin:8px 0}
  .msg li{margin:4px 0}
  .msg blockquote{
    border-inline-start:3px solid var(--accent);
    padding:4px 12px;margin:8px 0;color:var(--muted);
    background:var(--surface);border-radius:0 8px 8px 0;
  }
  .msg h1,.msg h2,.msg h3{margin:12px 0 6px;line-height:1.3;font-weight:600}
  .msg h1{font-size:1.35em}.msg h2{font-size:1.2em}.msg h3{font-size:1.08em}
  .msg a{color:var(--accent);text-decoration:none}
  .msg a:hover{text-decoration:underline}
  .msg hr{border:0;border-top:1px solid var(--line);margin:12px 0}

  /* ========== Actions under message ========== */
  .msg-actions{
    display:flex;gap:4px;margin-top:8px;
    opacity:0;transition:opacity .2s;flex-wrap:wrap;align-items:center;
  }
  .msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
  @media (hover:none){.msg-actions{opacity:1}}
  .msg-actions button{
    width:30px;height:30px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
  }
  .msg-actions button svg{width:15px;height:15px}
  .msg-actions button:hover{background:var(--surface2);color:var(--text)}
  .msg-actions button.active{color:var(--accent)}

  /* ========== Welcome Screen ========== */
  .welcome{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;gap:24px;
  }
  .welcome-logo{
    width:80px;height:80px;
    color:var(--accent);opacity:.9;
    animation:floatLogo 4s ease-in-out infinite;
  }
  @keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .welcome-logo svg{width:100%;height:100%}
  .welcome h1{
    margin:0;font-size:22px;font-weight:500;
    color:var(--text);line-height:1.4;
  }
  .welcome-actions{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:8px;
  }
  .welcome-chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:8px 16px;font-size:13px;color:var(--text);
    display:flex;align-items:center;gap:6px;
  }
  .welcome-chip:hover{background:var(--surface2);border-color:var(--accent)}
  .welcome-chip svg{width:15px;height:15px;color:var(--accent)}

  /* ========== Typing animation ========== */
  .typing{display:inline-flex;align-items:center;gap:4px;padding:4px 0}
  .typing .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:typingBounce 1.4s infinite ease-in-out;
  }
  .typing .dot:nth-child(1){animation-delay:0s}
  .typing .dot:nth-child(2){animation-delay:.2s}
  .typing .dot:nth-child(3){animation-delay:.4s}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-6px);opacity:1}
  }

  /* ========== Reasoning ========== */
  .reasoning{
    background:var(--surface);border:1px solid var(--line);
    border-radius:10px;margin-bottom:10px;padding:10px 12px;font-size:13px;
  }
  .reasoning summary{
    cursor:pointer;color:var(--muted);font-weight:500;
    user-select:none;display:flex;align-items:center;gap:6px;
    font-size:13px;
  }
  .reasoning summary svg{width:14px;height:14px}
  .reasoning[open] summary{margin-bottom:8px}
  .reasoning-content{
    color:var(--muted);white-space:pre-wrap;line-height:1.6;
    max-height:300px;overflow-y:auto;font-size:13px;
  }

  /* ========== Composer ========== */
  .composer-wrap{
    padding:8px 12px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    background:var(--bg);flex-shrink:0;
  }
  .composer{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:24px;
    padding:8px 8px 8px 14px;
    display:flex;flex-direction:column;gap:6px;
    transition:border-color .2s;
  }
  .composer:focus-within{border-color:var(--accent)}
  .composer.drag-over{border-color:var(--accent);border-style:dashed}
  .composer-row{display:flex;align-items:center;gap:6px}
  .composer-input{
    flex:1;resize:none;max-height:160px;
    background:transparent;border:0;color:var(--text);
    font:inherit;font-size:15px;line-height:1.5;
    padding:8px 4px;outline:none;
  }
  .composer-input::placeholder{color:var(--muted)}
  .composer-btn{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);flex-shrink:0;
  }
  .composer-btn svg{width:20px;height:20px}
  .composer-btn:hover{background:var(--surface2);color:var(--text)}
  .composer-btn:active{background:var(--surface3);transform:scale(.92)}
  .composer-btn.recording{color:var(--danger);animation:pulseMic 1.2s infinite}
  @keyframes pulseMic{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  .send-btn{
    width:36px;height:36px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:all .15s;
  }
  .send-btn svg{width:18px;height:18px}
  .send-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
  .send-btn:not(:disabled):hover{background:var(--accent-hover)}
  .send-btn:not(:disabled):active{transform:scale(.9)}
  .send-btn.stop{background:var(--surface2);color:var(--text)}

  .composer-features{
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  }
  .feature-btn{
    background:var(--surface2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;font-size:12px;
    color:var(--text);display:flex;align-items:center;gap:5px;
    transition:all .15s;
  }
  .feature-btn svg{width:13px;height:13px}
  .feature-btn:hover{border-color:var(--accent);color:var(--accent)}
  .feature-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .feature-btn.active:hover{background:var(--accent-hover)}

  /* ========== Attachments ========== */
  .attach-preview{
    display:none;gap:8px;padding:4px 2px;
    overflow-x:auto;flex-wrap:nowrap;
  }
  .attach-preview.show{display:flex}
  .attach-card{
    position:relative;flex:none;width:64px;height:64px;
    border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface2);
  }
  .attach-card img{width:100%;height:100%;object-fit:cover}
  .attach-card .remove{
    position:absolute;top:2px;right:2px;
    background:rgba(0,0,0,.7);color:#fff;border-radius:50%;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .attach-card .remove svg{width:12px;height:12px}

  /* ========== Drawer ========== */
  .drawer-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;
    width:min(85%,340px);
    background:var(--drawer);
    z-index:101;display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    border-inline-start:1px solid var(--line);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .drawer-head h3{margin:0;font-size:16px;font-weight:600}
  .drawer-search{
    margin:10px 12px;position:relative;
  }
  .drawer-search input{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;font-size:13px;
    padding:9px 36px 9px 12px;
  }
  .drawer-search input:focus{outline:none;border-color:var(--accent)}
  .drawer-search svg{
    position:absolute;top:50%;right:12px;transform:translateY(-50%);
    width:15px;height:15px;color:var(--muted);
    pointer-events:none;
  }
  .drawer-list{flex:1;overflow-y:auto;padding:4px 8px}
  .drawer-group-label{
    font-size:11px;color:var(--muted);padding:10px 12px 4px;
    font-weight:600;letter-spacing:.3px;
  }
  .drawer-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    font-size:14px;color:var(--text);
    cursor:pointer;position:relative;
  }
  .drawer-item:hover{background:var(--surface2)}
  .drawer-item.active{background:var(--accent);color:#fff}
  .drawer-item.active .drawer-item-meta{color:rgba(255,255,255,.8)}
  .drawer-item-body{flex:1;overflow:hidden}
  .drawer-item-title{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:14px;font-weight:500;
  }
  .drawer-item-meta{
    font-size:11px;color:var(--muted);margin-top:2px;
  }
  .drawer-item-actions{
    display:flex;gap:2px;opacity:0;
    transition:opacity .15s;
  }
  .drawer-item:hover .drawer-item-actions{opacity:1}
  @media (hover:none){.drawer-item-actions{opacity:1}}
  .drawer-item-actions button{
    width:26px;height:26px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    color:inherit;
  }
  .drawer-item-actions button svg{width:14px;height:14px}
  .drawer-item-actions button:hover{background:rgba(255,255,255,.15)}
  .drawer-item.active .drawer-item-actions button:hover{background:rgba(255,255,255,.2)}

  .drawer-footer{
    padding:12px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:10px;font-size:13px;
  }
  .drawer-footer .avatar{
    width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;
  }

  /* ========== Settings modal ========== */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    z-index:200;display:none;
    align-items:flex-end;justify-content:center;
    animation:fadeIn .2s;
  }
  .modal-overlay.open{display:flex}
  .modal{
    width:100%;max-width:560px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:16px;
    padding-bottom:max(16px,env(safe-area-inset-bottom));
    max-height:92dvh;overflow-y:auto;
    animation:slideUp .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 4px;font-size:17px;font-weight:600}
  .modal p{margin:0 0 10px;color:var(--muted);font-size:12px}
  .modal label{display:block;font-size:12px;margin:12px 0 4px;color:var(--muted);font-weight:500}
  .modal input[type="text"],.modal input[type="password"],.modal select{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;
    color:var(--text);font:inherit;font-size:14px;
    padding:10px 12px;direction:ltr;text-align:left;
  }
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--accent)}
  .modal textarea{
    width:100%;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;
    color:var(--text);font:inherit;font-size:14px;
    padding:10px 12px;direction:rtl;text-align:right;
    min-height:90px;resize:vertical;line-height:1.6;
  }
  .modal-tabs{
    display:flex;gap:4px;margin-bottom:12px;
    border-bottom:1px solid var(--line);overflow-x:auto;
  }
  .modal-tab{
    background:transparent;border:0;
    border-bottom:2px solid transparent;
    padding:8px 12px;font-size:13px;color:var(--muted);
    white-space:nowrap;
  }
  .modal-tab:hover{color:var(--text)}
  .modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .modal-tab-content{display:none}
  .modal-tab-content.active{display:block;animation:fadeIn .2s}

  .switch-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .switch-row:last-child{border:0}
  .switch{position:relative;width:42px;height:24px;flex:none;margin:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:var(--surface3);border-radius:24px;transition:.2s;
  }
  .slider::before{
    content:"";position:absolute;
    height:18px;width:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;
  }
  .switch input:checked+.slider{background:var(--accent)}
  .switch input:checked+.slider::before{transform:translateX(18px)}

  .range-row{margin:10px 0}
  .range-row label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500;
  }
  .range-row label span{color:var(--accent);font-weight:600}
  .range-row input[type="range"]{width:100%;accent-color:var(--accent)}

  .preset-btn{
    display:block;width:100%;text-align:right;
    background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin-bottom:6px;
    font-size:13px;line-height:1.4;
  }
  .preset-btn:hover{border-color:var(--accent)}
  .preset-btn strong{color:var(--text);font-weight:600;display:block}
  .preset-btn small{display:block;color:var(--muted);font-size:11px;margin-top:3px}

  .modal-actions{
    display:flex;gap:8px;margin-top:16px;
    position:sticky;bottom:0;background:var(--bg);padding-top:10px;
  }
  .modal-actions button{
    flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:600;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:var(--danger);color:#fff;border:0}

  /* ========== Toast ========== */
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--surface3);color:var(--text);
    border:1px solid var(--line);
    padding:10px 18px;border-radius:12px;font-size:13px;
    z-index:300;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;max-width:90%;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* ========== Image viewer ========== */
  .img-viewer{
    position:fixed;inset:0;background:rgba(0,0,0,.95);
    z-index:999;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .25s;padding:20px;
  }
  .img-viewer.show{opacity:1}
  .img-viewer img{max-width:95%;max-height:95%;object-fit:contain;border-radius:12px}
  .img-viewer .close{
    position:absolute;top:20px;right:20px;
    background:rgba(255,255,255,.15);color:#fff;
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* ========== User msg images ========== */
  .msg.user .msg-images{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:6px;margin-top:6px;max-width:280px;
  }
  .msg.user .msg-images.single{grid-template-columns:1fr;max-width:220px}
  .msg-image-wrap{
    border-radius:12px;overflow:hidden;cursor:zoom-in;
    position:relative;aspect-ratio:1;background:rgba(0,0,0,.2);

const PERSONAS = {

};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function msgText(m) {
  if (!m) return "";
  if (typeof m.content === "string") return m.content;
  if (Array.isArray(m.content)) return m.content.find(c => c.type === "text")?.text || "";
  return "";
}
function msgImgs(m) {
  return Array.isArray(m?.content) ? m.content.filter(c => c.type === "image_url").map(c => c.image_url.url) : [];
}

const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("rosto", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async clear() { const db = await this.open(); return new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").clear(); t.oncomplete = () => res(); t.onerror = () => res(); }); }
};
const b64 = { enc: (u8) => btoa(String.fromCharCode(...u8)), dec: (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function getDeviceKey() {
  let k = await idb.get("devkey");
  if (!k) { k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); await idb.set("devkey", k); }
  return k;
}
async function saveSecureKey(plain) {
  if (!plain) { store.del("rosto_key_v2"); return; }
  try {
    const key = await getDeviceKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain));
    store.set("rosto_key_v2", b64.enc(iv) + "." + b64.enc(new Uint8Array(ct)));
  } catch (e) { console.warn("فشل التشفير:", e); }
}
async function loadSecureKey() {
  const v2 = store.get("rosto_key_v2");
  if (v2) { try { const [iv, ct] = v2.split(".").map(b64.dec); const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await getDeviceKey(), ct); return new TextDecoder().decode(pt); } catch { return ""; } }
  const plain = store.get("rosto_key", "");
  if (plain) { await saveSecureKey(plain); return plain; }
  return "";
}

function abortable(p, ctl) {
  return new Promise((res, rej) => {
    if (!ctl) return p.then(res, rej);
    const onAbort = () => rej(new DOMException("aborted", "AbortError"));
    if (ctl.signal.aborted) return onAbort();
    ctl.signal.addEventListener("abort", onAbort, { once: true });
    p.then(res, rej);
  });
}
async function fetchRetry(url, opts, maxRetries = 3, ctl = null) {
  for (let i = 0; i <= maxRetries; i++) {
    try {
      const res = await abortable(fetch(url, opts), ctl);
      if (res.ok || (res.status < 500 && res.status !== 429)) return res;
      if (i === maxRetries) return res;
      await abortable(new Promise((r) => setTimeout(r, 1000 * 2 ** i)), ctl);
    } catch (e) {
      if (e.name === "AbortError" || i === maxRetries) throw e;
      await abortable(new Promise((r) => setTimeout(r, 1000 * 2 ** i)), ctl);
    }
  }
}

let apiKey = "";
let model = store.get("rosto_model", DEFAULT_MODEL) || DEFAULT_MODEL;
let systemPrompt = store.get("rosto_system", DEFAULT_SYSTEM) || DEFAULT_SYSTEM;
let ttsEnabled = store.get("rosto_tts", "0") === "1";

let maxHistory = parseInt(store.get("rosto_hist", "30"));
let imgQuality = parseInt(store.get("rosto_imgq", "82"));
let useSearch = false;

let messages = [];

let attachments = [];
let recognition = null;

const chat = $("chat");

const sendBtn = $("sendBtn");

const Sessions = {
  KEY: "rosto_sessions",
  CURRENT: "rosto_current_session",
  all() { try { return JSON.parse(store.get(this.KEY) || "{}"); } catch { return {}; } },
  save(all) { store.set(this.KEY, JSON.stringify(all)); },
  current() { let c = store.get(this.CURRENT, ""); if (!c || !this.all()[c]) c = this.create(); return c; },
  create(name = "محادثة جديدة") {
    const id = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    const all = this.all();
    all[id] = { id, name, createdAt: Date.now(), updatedAt: Date.now(), messages: [], pinned: false };
    this.save(all);
    store.set(this.CURRENT, id);
    return id;
  },
  update(id, patch) { const all = this.all(); if (!all[id]) return; all[id] = { ...all[id], ...patch, updatedAt: Date.now() }; this.save(all); },
  delete(id) {
    const all = this.all(); delete all[id]; this.save(all);
    if (store.get(this.CURRENT) === id) { const r = Object.keys(all); if (r.length) store.set(this.CURRENT, r[0]); else this.create(); }
  },
  list() { return Object.values(this.all()).sort((a, b) => ((b.pinned === true) - (a.pinned === true)) || (b.updatedAt - a.updatedAt)); },
  load(id) { const s = this.all()[id]; if (!s) return; if (controller) controller.abort(); store.set(this.CURRENT, id); messages = s.messages || []; restore(); }
};

function toast(msg, ms = 2200) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), ms);
}

const markedReady = typeof window.marked !== "undefined";
if (markedReady) marked.setOptions({ breaks: true, gfm: true });

function renderSimple(text) {
  return String(text).split("```").map((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[a-zA-Z0-9+#_-]*\n/, "").replace(/\n$/, "");
      return '<pre><code>' + esc(code) + '</code><button class="copy-code" onclick="copyCode(this)">نسخ</button></pre>';
    }
    let h = esc(part);
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return h.replace(/\n/g, "<br>");
  }).join("");
}
function render(text) {
  if (!markedReady || !window.DOMPurify) return renderSimple(text);
  try {
    const clean = DOMPurify.sanitize(marked.parse(String(text)), {
      FORBID_TAGS: ["style", "form", "img", "iframe", "object", "embed", "input", "button"],
      FORBID_ATTR: ["style", "onclick", "onerror"],
      ADD_ATTR: ["target"]
    });
    const tmp = document.createElement("div");
    tmp.innerHTML = clean;
    tmp.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer nofollow"; });
    tmp.querySelectorAll("pre code").forEach(el => {
      try { if (window.hljs) window.hljs.highlightElement(el); } catch {}
      const btn = document.createElement("button");
      btn.className = "copy-code";
      btn.textContent = "نسخ";
      btn.setAttribute("onclick", "copyCode(this)");
      el.parentElement.appendChild(btn);
    });
    return tmp.innerHTML;
  } catch { return renderSimple(text); }
}
window.copyCode = function (btn) {
  const code = btn.parentElement.querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(() => { btn.textContent = "✓"; setTimeout(() => btn.textContent = "نسخ", 1500); });
};
function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function splitThink(t) {
  const m = t.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if (!m) return { think: "", body: t };
  return { think: m[1].trim(), body: t.slice(m[0].length).trim() };
}

async function compressImage(file, maxDim = 1280, quality = imgQuality / 100) {
  if (!compressOn) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = (e) => res(e.target.result); r.onerror = rej; r.readAsDataURL(file); });
  }
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const r = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * r); height = Math.round(height * r);
      }
      const c = document.createElement("canvas");
      c.width = width; c.height = height;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad")); };
    img.src = url;
  });
}
async function attachImages(files) {
  const arr = [...files].filter(f => f.type.startsWith("image/"));
  if (!arr.length) return;
  for (const f of arr) {
    if (attachments.length >= MAX_IMAGES) { toast("الحد الأقصى " + MAX_IMAGES); break; }
    try { const dataUrl = await compressImage(f); attachments.push({ dataUrl, name: f.name }); } catch {}
  }
  renderAttachPreview();
  autoGrow();
}
function renderAttachPreview() {

  });
}

async function send(raw) {
  if (controller) return;
  const text = (raw || "").trim();
  if (!text && !attachments.length) return;
  if (!apiKey) { openSettings(); return toast("أضف مفتاح Groq"); }

  messages = messages.filter(m => m && m.content);
  const needsVision = attachments.length > 0 || messages.slice(-maxHistory).some(m => msgImgs(m).length);
  let useModel = model;
  if (needsVision && !isVisionModel(model)) {
    if (!autoVision) return toast("الموديل مش بيدعم الصور");
    useModel = "llama-3.2-11b-vision-preview";
  }

  const imgs = attachments.slice();
  const userContent = imgs.length
    ? [{ type: "text", text: text || "حلل الصور دي" }, ...imgs.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } }))]
    : text;

  if (!messages.length) chat.innerHTML = "";
  messages.push({ role: "user", content: userContent });
  drawMessage(messages[messages.length - 1], messages.length - 1);
  attachments = []; renderAttachPreview();
  input.value = ""; autoGrow();

  const el = document.createElement("div");
  el.className = "msg assistant";
  const rBox = document.createElement("div");
  const cBox = document.createElement("div");
  cBox.appendChild(typingAnim());
  el.append(rBox, cBox);
  chat.appendChild(el); scrollDown();

  setBusy(true);
  controller = new AbortController();
  const ctl = controller;
  let partial = "", reasoningBuf = "", usage = null, finishReason = "";

  const paint = () => {
    const sp = splitThink(partial);
    const rt = reasoningBuf || sp.think;
    if (rt && reasoningEnabled) {
      if (!rBox.firstChild) {
        rBox.innerHTML = '<details class="reasoning"><summary>' + ICON.brain + ' تفكير الموديل</summary><div class="reasoning-content"></div></details>';
      }
      rBox.querySelector(".reasoning-content").textContent = rt;
    }
    if (sp.body) cBox.innerHTML = render(sp.body);
    scrollDown();
  };
  const fail = (msg) => {
    messages.pop();
    input.value = text; autoGrow();
    if (imgs.length) { attachments = imgs; renderAttachPreview(); }
    restore();
    const e = document.createElement("div");
    e.className = "msg assistant err"; e.textContent = msg;
    chat.appendChild(e); scrollDown();
  };

  let finalSystem = systemPrompt;
  if (useSearch) finalSystem += "\n[استخدم معلومات حديثة]";
  if (useThink) finalSystem += "\n[فكر خطوة بخطوة قبل الرد]";

  const body = {
    model: useModel,
    messages: finalSystem ? [{ role: "system", content: finalSystem }, ...prepareHistory()] : prepareHistory(),
    max_tokens: maxTokens,
    temperature, top_p: topP,
    stream: streamEnabled
  };
  if (REASONING_MODELS.test(useModel)) body.reasoning_format = "parsed";

  try {
    const opts = {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
    const res = await fetchRetry(API_URL, opts, 3, ctl);

    if (!res.ok) {
      let detail = "";
      try { const j = await abortable(res.json(), ctl); detail = j.error?.message || ""; } catch {}
      return fail("خطأ " + res.status + (detail ? ": " + detail : ""));
    }

    if (!streamEnabled) {
      const data = await abortable(res.json(), ctl);
      const msg = data.choices?.[0]?.message || {};
      partial = msg.content || "";
      reasoningBuf = msg.reasoning || "";
      usage = data.usage;
      finishReason = data.choices?.[0]?.finish_reason || "";
      paint();
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await abortable(reader.read(), ctl);
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          let json;
          try { json = JSON.parse(data); } catch { continue; }
          usage = json.x_groq?.usage || json.usage || usage;
          const ch = json.choices?.[0];
          if (!ch) continue;
          if (ch.finish_reason) finishReason = ch.finish_reason;
          const d = ch.delta;
          if (!d) continue;
          let changed = false;
          const rs = d.reasoning_content ?? d.reasoning;
          if (rs) { reasoningBuf += rs; changed = true; }
          if (d.content) { partial += d.content; changed = true; }
          if (changed) paint();
        }
      }
    }

    const sp = splitThink(partial);
    const finalText = sp.body || partial;
    if (!finalText.trim()) return fail("ماجاش رد");
    el.remove();
    const msg = { role: "assistant", content: finalText };
    if (reasoningBuf || sp.think) msg.reasoning = reasoningBuf || sp.think;
    if (usage?.total_tokens) msg.usage = { p: usage.prompt_tokens, c: usage.completion_tokens, t: usage.total_tokens };
    messages.push(msg);
    drawMessage(msg, messages.length - 1);
    restore(); saveChat();
    if (ttsEnabled) speak(finalText);
  } catch (e) {
    if (e.name === "AbortError") {
      const sp = splitThink(partial);
      const finalText = sp.body || partial;
      if (finalText.trim()) { messages.push({ role: "assistant", content: finalText }); saveChat(); }
      restore();
    } else {
      fail("مشكلة في الاتصال: " + e.message);
    }
  } finally {
    controller = null;
    setBusy(false);
  }
}

function drawDrawer() {
  const list = $("drawerList"); list.innerHTML = "";
  const current = Sessions.current();
  const sessions = Sessions.list();
  if (!sessions.length) { list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;font-size:13px">مفيش محادثات</p>'; return; }
  const groups = {};
  sessions.forEach(s => {
    const d = new Date(s.updatedAt);
    const today = new Date();
    const diff = Math.floor((today - d) / 86400000);
    let label;
    if (diff === 0) label = "اليوم";
    else if (diff === 1) label = "أمس";
    else if (diff < 7) label = "آخر أسبوع";
    else if (diff < 30) label = "آخر شهر";
    else label = d.toLocaleDateString("ar-EG", { month: "long", year: "numeric" });
    if (!groups[label]) groups[label] = [];
    groups[label].push(s);
  });
  Object.entries(groups).forEach(([label, items]) => {
    const gl = document.createElement("div");
    gl.className = "drawer-group-label";
    gl.textContent = label;
    list.appendChild(gl);
    items.forEach(s => {
      const item = document.createElement("div");
      item.className = "drawer-item" + (s.id === current ? " active" : "");
      item.innerHTML = `
        <div class="drawer-item-body">
          <div class="drawer-item-title">${esc(s.name)}</div>
          <div class="drawer-item-meta">${(s.messages || []).length} رسالة</div>
        </div>
        <div class="drawer-item-actions">
          <button data-act="del" title="حذف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </div>`;
      item.onclick = (e) => {
        if (e.target.closest("[data-act]")) {
          e.stopPropagation();
          if (confirm("حذف؟")) { Sessions.delete(s.id); if (s.id === current) { messages = Sessions.all()[Sessions.current()]?.messages || []; restore(); } drawDrawer(); }
          return;
        }
        if (s.id === current) { closeDrawer(); return; }
        if (messages.length) saveChat();
        Sessions.load(s.id); closeDrawer();
      };
      list.appendChild(item);
    });
  });
}
$("menuBtn").onclick = openDrawer;
$("closeDrawer").onclick = closeDrawer;
$("drawerOverlay").onclick = closeDrawer;
$("newChatBtn").onclick = () => { if (messages.length) saveChat(); Sessions.create(); messages = []; attachments = []; renderAttachPreview(); restore(); };
$("drawerSearch").oninput = (e) => {
  const q = e.target.value.trim();
  const list = $("drawerList");
  if (!q) return drawDrawer();
  const sessions = Sessions.list().filter(s => s.name.includes(q) || (s.messages || []).some(m => msgText(m).includes(q)));
  list.innerHTML = "";
  if (!sessions.length) { list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px;font-size:13px">لا نتائج</p>'; return; }
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = "drawer-item";
    item.innerHTML = `<div class="drawer-item-body"><div class="drawer-item-title">${esc(s.name)}</div></div>`;
    item.onclick = () => { if (messages.length) saveChat(); Sessions.load(s.id); closeDrawer(); };
    list.appendChild(item);
  });
};

function openSettings() {
  $("keyInput").value = apiKey;
  $("modelInput").value = model;
  $("systemInput").value = systemPrompt;
  $("modelSelect").value = model;
  $("autoVisionToggle").checked = autoVision;
  $("compressToggle").checked = compressOn;
  $("ttsToggle").checked = ttsEnabled;
  $("streamToggle").checked = streamEnabled;
  $("reasoningToggle").checked = reasoningEnabled;
  $("tempRange").value = temperature; $("tempVal").textContent = temperature;
  $("maxTokRange").value = maxTokens; $("maxTokVal").textContent = maxTokens;
  $("topPRange").value = topP; $("topPVal").textContent = topP;
  $("histRange").value = maxHistory; $("histVal").textContent = maxHistory;
  $("imgQRange").value = imgQuality; $("imgQVal").textContent = imgQuality;
  $("settings").classList.add("open");
}
function closeSettings() { $("settings").classList.remove("open"); }
$("openSettings").onclick = () => { closeDrawer(); openSettings(); };
$("closeSettings").onclick = closeSettings;
$("settings").onclick = (e) => { if (e.target.id === "settings") closeSettings(); };

$("saveSettings").onclick = async () => {
  const nk = $("keyInput").value.trim();
  if (nk !== apiKey) { await saveSecureKey(nk); apiKey = nk; }
  model = $("modelInput").value.trim() || $("modelSelect").value;
  systemPrompt = $("systemInput").value.trim();
  autoVision = $("autoVisionToggle").checked;
  compressOn = $("compressToggle").checked;
  ttsEnabled = $("ttsToggle").checked;
  streamEnabled = $("streamToggle").checked;
  reasoningEnabled = $("reasoningToggle").checked;
  temperature = parseFloat($("tempRange").value);
  maxTokens = parseInt($("maxTokRange").value);
  topP = parseFloat($("topPRange").value);
  maxHistory = parseInt($("histRange").value);
  imgQuality = parseInt($("imgQRange").value);
  store.set("rosto_model", model);
  store.set("rosto_system", systemPrompt);
  store.set("rosto_autovision", autoVision ? "1" : "0");
  store.set("rosto_compress", compressOn ? "1" : "0");
  store.set("rosto_tts", ttsEnabled ? "1" : "0");
  store.set("rosto_stream", streamEnabled ? "1" : "0");
  store.set("rosto_reasoning", reasoningEnabled ? "1" : "0");
  store.set("rosto_temp", temperature);
  store.set("rosto_maxtok", maxTokens);
  store.set("rosto_topp", topP);
  store.set("rosto_hist", maxHistory);
  store.set("rosto_imgq", imgQuality);
  updateMuteIcon();
  closeSettings(); toast("تم الحفظ");
  if (nk) loadModels();
};

document.querySelectorAll(".modal-tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".modal-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".modal-tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    $(tab.dataset.tab).classList.add("active");
  };
});
[["temp","tempRange"],["maxTok","maxTokRange"],["topP","topPRange"],["hist","histRange"],["imgQ","imgQRange"]]
  .forEach(([k, id]) => { $(id).oninput = (e) => $(k + "Val").textContent = e.target.value; });

document.querySelectorAll("[data-theme]").forEach(b => {
  b.onclick = () => { theme = b.dataset.theme; store.set("rosto_theme", theme); applyTheme(); toast("تم"); };
});

$("reloadModels").onclick = async () => {
  if (!apiKey) return toast("أضف المفتاح أولاً");
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    const { data } = await r.json();
    const list = (data || []).filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id)).sort((a, b) => a.id.localeCompare(b.id));
    const sel = $("modelSelect"); sel.innerHTML = "";
    list.forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = m.id; sel.appendChild(o); });
    toast(`${list.length} موديل`);
  } catch { toast("فشل"); }
};

$("exportChatBtn").onclick = () => {
  if (!messages.length) return toast("لا رسائل");
  const t = messages.map(m => `${m.role === "user" ? "أنت" : "ROSTO"}: ${msgText(m)}`).join("\n\n");
  download(t, "text/plain", `chat-${Date.now()}.txt`);
};
$("exportAllBtn").onclick = () => {
  const d = { version: 2, date: new Date().toISOString(), sessions: Sessions.all(), current: Sessions.current(),
    settings: { model, systemPrompt, ttsEnabled, streamEnabled, autoVision, compressOn, reasoningEnabled, theme, temperature, maxTokens, topP, maxHistory, imgQuality } };
  download(JSON.stringify(d, null, 2), "application/json", `backup-${Date.now()}.json`);
};
$("restoreAllBtn").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.sessions) throw new Error("ملف غير صالح");
    if (!confirm("هتستبدل كل شيء. متأكد؟")) return;
    Sessions.save(d.sessions);
    if (d.current) store.set(Sessions.CURRENT, d.current);
    location.reload();
  } catch (err) { toast("فشل: " + err.message); }
  e.target.value = "";
};
$("clearAllBtn").onclick = () => {
  if (!confirm("مسح كل شيء؟")) return;
  Object.keys(localStorage).filter(k => k.startsWith("rosto_")).forEach(k => localStorage.removeItem(k));
  idb.clear().finally(() => location.reload());
};
function download(content, mime, name) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function loadModels() {
  if (!apiKey) return;
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    const { data } = await r.json();
    const list = (data || []).filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id));
    const sel = $("modelSelect");
    if (list.length) {
      sel.innerHTML = "";
      list.sort((a, b) => a.id.localeCompare(b.id)).forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = m.id; sel.appendChild(o); });
      sel.value = model;
    }
  } catch {}
}

$("micBtn").onclick = () => isRecording ? stopRecording() : startRecording();
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async (e) => { await attachImages(e.target.files); e.target.value = ""; };
$("searchWebBtn").onclick = () => { useSearch = !useSearch; $("searchWebBtn").classList.toggle("active", useSearch); toast(useSearch ? "🔍 البحث مفعّل" : "البحث متوقف"); };
$("thinkBtn").onclick = () => { useThink = !useThink; $("thinkBtn").classList.toggle("active", useThink); toast(useThink ? "🧠 التفكير مفعّل" : "التفكير متوقف"); };

sendBtn.onclick = () => { if (controller) controller.abort(); else send(input.value); };
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) {
    e.preventDefault(); send(input.value);
  }
});
document.addEventListener("paste", async (e) => {
  if (!e.clipboardData) return;
  const files = [...e.clipboardData.items].filter(it => it.type.startsWith("image/")).map(it => it.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); await attachImages(files); }
});

(async function init() {
  try { apiKey = await loadSecureKey(); } catch { apiKey = ""; }
  const s = Sessions.all()[Sessions.current()];
  if (s?.messages?.length) messages = s.messages;
  buildPersonaList();
  applyTheme();
  updateMuteIcon();
  restore();
  if (apiKey) loadModels();
  else setTimeout(() => { toast("أضف مفتاح Groq من الإعدادات", 3500); openSettings(); }, 800);
})();
</script>
