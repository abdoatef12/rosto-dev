<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1724">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROSTO DEV">
<title>ROSTO DEV</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0F1724; --surface: #172234; --surface2: #1E2C42;
    --line: #26344A; --text: #ECE7DA; --muted: #8B98AD;
    --accent: #E3A84B; --accent-ink: #1A1305;
    --accent2: #6D8FFF; --accent3: #FF6B9D;
    --danger: #F08A7A; --ok: #6DCF8F; --code-bg: #0A111C;
    --glow: rgba(227,168,75,0.35);
  }
  [data-theme="light"] {
    --bg: #F5F2EA; --surface: #FFFFFF; --surface2: #EFEBE0;
    --line: #D8D2C2; --text: #1A1305; --muted: #6B6455;
    --accent: #B8860B; --accent-ink: #FFFFFF; --code-bg: #F0EBDD;
    --accent2: #4169E1; --accent3: #D6336C;
    --glow: rgba(184,134,11,0.25);
  }
  [data-theme="ocean"] {
    --bg: #071A2B; --surface: #0E2A42; --surface2: #153654;
    --line: #1E4A6E; --text: #E0F2FE; --muted: #7DA8C9;
    --accent: #22D3EE; --accent-ink: #04212B; --code-bg: #051520;
    --accent2: #38BDF8; --accent3: #818CF8;
    --glow: rgba(34,211,238,0.35);
  }
  [data-theme="forest"] {
    --bg: #0B1E14; --surface: #142E20; --surface2: #1B3D2C;
    --line: #24523A; --text: #E5F5E9; --muted: #8AB89A;
    --accent: #34D399; --accent-ink: #052B1B; --code-bg: #061209;
    --accent2: #6EE7B7; --accent3: #FBBF24;
    --glow: rgba(52,211,153,0.35);
  }
  [data-theme="royal"] {
    --bg: #150A2E; --surface: #211440; --surface2: #2D1B54;
    --line: #3F2A6B; --text: #EDE9FE; --muted: #A78BFA;
    --accent: #C084FC; --accent-ink: #2A0A4D; --code-bg: #0D0620;
    --accent2: #F472B6; --accent3: #60A5FA;
    --glow: rgba(192,132,252,0.4);
  }
  [data-theme="sunset"] {
    --bg: #2A0F14; --surface: #3D1A22; --surface2: #4E2430;
    --line: #6B3341; --text: #FFE4E6; --muted: #F0A5B4;
    --accent: #FB7185; --accent-ink: #450A0A; --code-bg: #1A080C;
    --accent2: #FDBA74; --accent3: #FDE047;
    --glow: rgba(251,113,133,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    font-size: 16px; line-height: 1.75;
    display: flex; flex-direction: column; height: 100dvh;
    transition: background 0.4s ease, color 0.4s ease;
  }
  /* ===== خلفية متدرجة ديناميكية ===== */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 15%, var(--glow), transparent 50%),
      radial-gradient(ellipse at 85% 85%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 50%);
    opacity: 0.6;
    transition: opacity 0.4s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    position: relative; z-index: 5;
  }
  .brand { font-weight: 700; font-size: 17px; direction: ltr; }
  .brand small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); direction: rtl; line-height: 1.3; }
  .brand small .dot { color: var(--accent); animation: pulseDot 1.8s infinite; }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .actions { display: flex; gap: 5px; }
  button { font: inherit; color: inherit; cursor: pointer; transition: all 0.2s ease; }
  .ghost {
    background: transparent; border: 1px solid var(--line); border-radius: 9px;
    padding: 5px 9px; font-size: 13px; color: var(--muted);
  }
  .ghost:hover { color: var(--accent); border-color: var(--accent); }
  .ghost:active { background: var(--surface); transform: scale(0.96); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 100%; word-wrap: break-word; overflow-wrap: anywhere; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-start;
    background: linear-gradient(135deg, var(--surface), var(--surface2));
    border-inline-start: 3px solid var(--accent);
    border-radius: 4px 14px 14px 14px;
    padding: 8px 14px; max-width: 88%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .msg.assistant { align-self: stretch; padding: 0 2px; }
  .msg.err { color: var(--danger); }
  .msg code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.9em; background: var(--code-bg);
    padding: 1px 6px; border-radius: 6px;
    direction: ltr; unicode-bidi: embed;
    color: var(--accent2);
  }
  .msg pre {
    direction: ltr; text-align: left;
    background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin: 10px 0;
    overflow-x: auto; line-height: 1.5; position: relative;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .msg pre code { background: none; padding: 0; font-size: 13px; color: var(--text); }
  .msg pre .copy-code {
    position: absolute; top: 6px; right: 6px;
    background: var(--surface2); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; font-size: 11px;
    color: var(--muted); cursor: pointer;
  }
  .msg pre .copy-code:hover { color: var(--accent); border-color: var(--accent); }
  .bubble-tools { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .bubble-tools button {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--muted);
  }
  .bubble-tools button:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
  .bubble-tools button:active { color: var(--accent); border-color: var(--accent); }

  /* ===== 3 أنيميشنز للرد ===== */
  .typing-anim { display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
  .typing-anim .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); animation: bounceDot 1.2s infinite ease-in-out;
  }
  .typing-anim .dot:nth-child(2) { animation-delay: 0.15s; background: var(--accent2); }
  .typing-anim .dot:nth-child(3) { animation-delay: 0.3s; background: var(--accent3); }
  @keyframes bounceDot {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  .typing-anim.wave { gap: 3px; }
  .typing-anim.wave .dot {
    width: 4px; height: 18px; border-radius: 2px;
    animation: waveBar 1s infinite ease-in-out;
  }
  .typing-anim.wave .dot:nth-child(1) { animation-delay: 0s; background: var(--accent); }
  .typing-anim.wave .dot:nth-child(2) { animation-delay: 0.1s; background: var(--accent2); }
  .typing-anim.wave .dot:nth-child(3) { animation-delay: 0.2s; background: var(--accent3); }
  .typing-anim.wave .dot:nth-child(4) { animation-delay: 0.3s; background: var(--accent); }
  .typing-anim.wave .dot:nth-child(5) { animation-delay: 0.4s; background: var(--accent2); }
  @keyframes waveBar {
    0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .typing-anim.glow {
    padding: 6px 14px; border-radius: 10px;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 20%, transparent), transparent);
    background-size: 200% 100%;
    animation: glowSweep 2s infinite;
    color: var(--accent); font-size: 13px; font-weight: 600;
  }
  @keyframes glowSweep {
    0% { background-position: -100% 0; }
    100% { background-position: 200% 0; }
  }

  /* ===== Empty state ===== */
  .empty { margin: auto 0; padding: 8px 0; }
  .empty h2 { margin: 0 0 4px; font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800;
  }
  .empty p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .chip {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 7px 14px; font-size: 14px;
    position: relative; overflow: hidden;
  }
  .chip::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    transform: translateX(-100%); transition: transform 0.5s;
  }
  .chip:hover { border-color: var(--accent); transform: translateX(-3px); }
  .chip:hover::before { transform: translateX(100%); }
  .chip:active { border-color: var(--accent); }

  .composer {
    display: flex; flex-direction: column; gap: 6px;
    padding: 9px 12px;
    padding-bottom: max(9px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
  }
  .composer-row { display: flex; align-items: flex-end; gap: 6px; }
  textarea {
    flex: 1; resize: none; max-height: 160px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; color: var(--text);
    font: inherit; line-height: 1.5; padding: 10px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  textarea::placeholder { color: var(--muted); }
  textarea.recording { border-color: var(--danger); animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(240,138,122,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(240,138,122,0); }
  }
  .icon-btn {
    flex: none; width: 42px; height: 42px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text);
    font-size: 17px; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .icon-btn:active { background: var(--surface2); border-color: var(--accent); transform: scale(0.95); }
  .icon-btn.on { background: var(--danger); border-color: var(--danger); color: white; }
  #send {
    flex: none; min-width: 55px; height: 42px;
    border: 0; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--accent-ink);
    font-weight: 700; font-size: 14px; padding: 0 12px;
    box-shadow: 0 4px 14px var(--glow);
  }
  #send:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--glow); }
  #send:active { transform: scale(0.97); }
  #send.stop { background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .attach-preview { display: none; position: relative; width: fit-content; max-width: 100%; }
  .attach-preview img { max-height: 100px; border-radius: 10px; border: 1px solid var(--line); }
  .attach-preview.show { display: block; }
  .attach-preview .remove {
    position: absolute; top: -8px; left: -8px;
    background: var(--danger); color: white; border: 0;
    border-radius: 50%; width: 24px; height: 24px; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5, 9, 16, 0.85);
    backdrop-filter: blur(6px);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 10;
    animation: fadeIn 0.3s;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 560px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    padding: 16px 14px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    max-height: 92dvh; overflow-y: auto;
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  .sheet p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .sheet label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--muted); }
  .sheet input[type="text"], .sheet input[type="password"], .sheet select {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text);
    font: inherit; font-size: 14px; padding: 8px 12px;
    direction: ltr; text-align: left;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sheet input:focus, .sheet select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .sheet textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text);
    font: inherit; font-size: 14px; padding: 10px 12px;
    direction: rtl; text-align: right; min-height: 100px; resize: vertical;
    line-height: 1.6;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sheet textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .tabs {
    display: flex; gap: 4px; margin-bottom: 12px;
    border-bottom: 1px solid var(--line); overflow-x: auto;
  }
  .tab {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 12px; font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s; }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .switch-row:last-child { border: 0; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--line); border-radius: 24px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute;
    height: 18px; width: 18px; left: 3px; top: 3px;
    background: var(--text); border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .slider { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: var(--accent-ink); }
  .range-row { margin: 10px 0; }
  .range-row label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); margin-bottom: 4px;
  }
  .range-row label span { color: var(--accent); font-weight: 700; }
  .range-row input[type="range"] { width: 100%; accent-color: var(--accent); }
  .preset-btn {
    display: block; width: 100%; text-align: right;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 6px;
    font-size: 14px; line-height: 1.4;
    position: relative; overflow: hidden;
  }
  .preset-btn:hover { border-color: var(--accent); transform: translateX(-3px); }
  .preset-btn:active { border-color: var(--accent); }
  .preset-btn strong { color: var(--accent); }
  .preset-btn small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .row { display: flex; gap: 8px; margin-top: 14px; position: sticky; bottom: 0; background: var(--bg); padding-top: 10px; }
  .row .primary {
    flex: 1; height: 42px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--accent-ink); font-weight: 700;
    box-shadow: 0 4px 14px var(--glow);
  }
  .row .primary:hover { transform: translateY(-1px); }
  .row .ghost { height: 42px; }
  .row .danger { background: var(--danger); color: white; border: 0; }
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 12px;
    font-size: 13px; z-index: 30;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    max-width: 90%; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* شريط ألوان سريع */
  .theme-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .theme-dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--line); cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active { border-color: var(--accent); transform: scale(1.15); box-shadow: 0 0 0 3px var(--glow); }
  .theme-dot[data-t="dark"] { background: linear-gradient(135deg, #0F1724, #E3A84B); }
  .theme-dot[data-t="light"] { background: linear-gradient(135deg, #F5F2EA, #B8860B); }
  .theme-dot[data-t="ocean"] { background: linear-gradient(135deg, #071A2B, #22D3EE); }
  .theme-dot[data-t="forest"] { background: linear-gradient(135deg, #0B1E14, #34D399); }
  .theme-dot[data-t="royal"] { background: linear-gradient(135deg, #150A2E, #C084FC); }
  .theme-dot[data-t="sunset"] { background: linear-gradient(135deg, #2A0F14, #FB7185); }
</style>
</head>
<body data-theme="dark">

<header>
  <div class="brand">ROSTO DEV<small>Developer Edition <span class="dot">●</span> Unrestricted Mode</small></div>
  <div class="actions">
    <button class="ghost" id="themeToggle" title="تغيير اللون">🎨</button>
    <button class="ghost" id="newChat">جديدة</button>
    <button class="ghost" id="openSettings">⚙️</button>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<div class="composer">
  <div id="attachPreview" class="attach-preview">
    <img id="attachImg" alt="">
    <button class="remove" id="removeAttach">×</button>
  </div>
  <div class="composer-row">
    <button class="icon-btn" id="attachBtn">📎</button>
    <button class="icon-btn" id="micBtn">🎤</button>
    <textarea id="input" rows="1" placeholder="اكتب رسالتك…"></textarea>
    <button id="send">إرسال</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<div class="overlay" id="settings">
  <div class="sheet" role="dialog">
    <h3>الإعدادات</h3>
    <div class="tabs">
      <button class="tab active" data-tab="t-general">عام</button>
      <button class="tab" data-tab="t-persona">الشخصيات</button>
      <button class="tab" data-tab="t-advanced">متقدم</button>
      <button class="tab" data-tab="t-presets">قوالب</button>
      <button class="tab" data-tab="t-theme">الألوان</button>
    </div>

    <div class="tab-content active" id="t-general">
      <label>مفتاح Groq</label>
      <input id="keyInput" type="password" placeholder="gsk_...">

      <label>موديل النص</label>
      <select id="modelSelect">
        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (الأقوى)</option>
        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (أسرع)</option>
        <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="allam-2-7b">allam-2-7b (عربي)</option>
      </select>
      <label>أو اكتب مخصص</label>
      <input id="modelInput" type="text" placeholder="اسم الموديل">

      <div style="margin-top:12px">
        <div class="switch-row">
          <div>🔓 وضع بدون قيود (Unrestricted)</div>
          <label class="switch"><input type="checkbox" id="unrestrictedToggle"><span class="slider"></span></label>
        </div>
        <div class="switch-row">
          <div>🔊 الرد الصوتي التلقائي</div>

// ============= Markdown =============
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function render(text) {
  return text.split("```").map((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[a-zA-Z0-9+#_-]*\n/, "").replace(/\n$/, "");
      return '<pre><code>' + esc(code) + '</code><button class="copy-code" onclick="copyCode(this)">نسخ</button></pre>';
    }
    let h = esc(part);
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return h.replace(/\n/g, "<br>");
  }).join("");
}

window.copyCode = function(btn) {

};

function speak(text) {
  if (!("speechSynthesis" in window)) return toast("النطق مش مدعوم");
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/```[\s\S]*?```/g, " كود ").replace(/[`*#_>]/g, "").slice(0, 600);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ar-SA"; u.rate = 1.0; u.pitch = 1.0;
  const v = window.speechSynthesis.getVoices().find(v => v.lang.startsWith("ar"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

let recognition = null;
let isRecording = false;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "ar-EG"; r.continuous = false; r.interimResults = true;
  r.onresult = (e) => {
    let finalText = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t;
      else interim += t;
    }
    input.value = finalText || interim;
    autoGrow();
    if (finalText && autoSend) {
      setTimeout(() => { if (input.value.trim()) send(input.value); }, 400);
    }
  };
  r.onerror = () => stopRecording();
  r.onend = () => stopRecording();
  return r;
}

function startRecording() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return toast("المتصفح مش بيدعم الإدخال الصوتي");
  try {
    recognition.start();
    isRecording = true;
    $("micBtn").classList.add("on");
    input.classList.add("recording");
    input.placeholder = "🎤 بتسمع…";
  } catch (e) { toast("الميكروفون مشغول"); }
}

function stopRecording() {
  isRecording = false;
  $("micBtn").classList.remove("on");
  input.classList.remove("recording");
  input.placeholder = "اكتب رسالتك…";
  if (recognition) try { recognition.stop(); } catch (e) {}
}

    attachedImage = e.target.result;
    $("attachImg").src = attachedImage;
    $("attachPreview").classList.add("show");
  };
  reader.readAsDataURL(file);
}

}

  if (!messages.length) chat.innerHTML = "";

  messages.push({ role: "user", content: text });
  addBubble("user", text);
  input.value = "";
  autoGrow();

  const el = addBubble("assistant", "");
  // ✅ إضافة أنيميشن الرد
  const anim = makeTypingAnim();
  el.appendChild(anim);
  setBusy(true);
  controller = new AbortController();
  let partial = "";
  let firstChunk = true;

  const fail = (msg) => {
    messages.pop();
    el.innerHTML = "";
    el.classList.add("err");
    el.textContent = msg;
    setBusy(false);
  };

  // دمج البرومبت مع وضع بدون قيود
  let finalSystem = systemPrompt;
  if (unrestricted) {
    finalSystem = UNRESTRICTED_PROMPT + "\n\n=== تعليمات إضافية ===\n" + systemPrompt;
  }

  const body = {
    model: model,
    messages: [{ role: "system", content: finalSystem }].concat(messages.slice(-maxHistory)),
    max_tokens: maxTokens,
    temperature: temperature,
    top_p: topP,
    frequency_penalty: freqPenalty,
    presence_penalty: presPenalty,
    stream: streamEnabled
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      signal: controller.signal,
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      let detail = "";
      try {
        const j = await res.json();
        detail = j.error?.message || JSON.stringify(j).slice(0, 200);
      } catch (e) { detail = await res.text().catch(() => ""); }
      return fail("خطأ " + res.status + ": " + detail);
    }

    if (!streamEnabled) {
      const data = await res.json();
      partial = data.choices[0].message.content || "";
      el.innerHTML = render(partial);
      scrollDown();
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder("utf-8");
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;
          try {
            const delta = JSON.parse(data).choices[0].delta.content;
            if (delta) {
              if (firstChunk) { el.innerHTML = ""; firstChunk = false; }
              partial += delta;
              el.innerHTML = render(partial);
              scrollDown();
            }
          } catch (e) {}
        }
      }
    }

    if (!partial) return fail("ماجاش رد، جرب تاني.");
    messages.push({ role: "assistant", content: partial });
    saveChat();
    addAssistantTools(el, partial);
    if (ttsEnabled) speak(partial);

  } catch (e) {
    if (e.name === "AbortError") {
      if (partial) {
        messages.push({ role: "assistant", content: partial });
        saveChat();
        addAssistantTools(el, partial);
      } else {
        messages.pop();
        el.remove();
      }
    } else {
      console.error(e);
      fail("مشكلة في الاتصال: " + e.message);
    }
  } finally {
    controller = null;
    setBusy(false);
  }
}

// ============= Settings =============
function applyTheme() {
  document.body.setAttribute("data-theme", theme);
  // تطبيق شدة التوهج
  document.documentElement.style.setProperty("--glow", 
    `color-mix(in srgb, var(--accent) ${glowLevel}%, transparent)`);
}

function applyGlow() {
  const alpha = (glowLevel / 100).toFixed(2);
  if (theme === "dark") document.documentElement.style.setProperty("--glow", `rgba(227,168,75,${alpha})`);
  else if (theme === "light") document.documentElement.style.setProperty("--glow", `rgba(184,134,11,${alpha})`);
  else if (theme === "ocean") document.documentElement.style.setProperty("--glow", `rgba(34,211,238,${alpha})`);
  else if (theme === "forest") document.documentElement.style.setProperty("--glow", `rgba(52,211,153,${alpha})`);
  else if (theme === "royal") document.documentElement.style.setProperty("--glow", `rgba(192,132,252,${alpha})`);
  else if (theme === "sunset") document.documentElement.style.setProperty("--glow", `rgba(251,113,133,${alpha})`);
}

function buildPersonaList() {
  const list = $("personaList");
  list.innerHTML = "";
  Object.entries(PERSONAS).forEach(([name, prompt]) => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.innerHTML = `<strong>${name}</strong><small>${prompt.slice(0, 70)}...</small>`;
    btn.onclick = () => {
      $("systemInput").value = prompt;
      toast("تم تحميل: " + name);
    };
    list.appendChild(btn);
  });
}

function buildPresetList() {
  const list = $("presetList");
  list.innerHTML = "";
  Object.entries(PRESETS).forEach(([name, text]) => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.innerHTML = `<strong>${name}</strong><small>${text.slice(0, 70)}...</small>`;
    btn.onclick = () => {
      input.value = text;
      autoGrow();
      closeSettings();
      input.focus();
    };
    list.appendChild(btn);
  });
}

function buildThemeDots() {
  document.querySelectorAll(".theme-dot").forEach(dot => {
    dot.classList.toggle("active", dot.dataset.t === theme);
    dot.onclick = () => {
      theme = dot.dataset.t;
      store.set("rosto_theme", theme);
      applyTheme();
      applyGlow();
      document.querySelectorAll(".theme-dot").forEach(d => d.classList.remove("active"));
      dot.classList.add("active");
      toast("🎨 تم تغيير الثيم");
    };
  });
}

function openSettings() {
  $("keyInput").value = apiKey;
  $("modelInput").value = model;
  $("systemInput").value = systemPrompt;
  $("ttsToggle").checked = ttsEnabled;
  $("autoSendToggle").checked = autoSend;
  $("streamToggle").checked = streamEnabled;
  $("unrestrictedToggle").checked = unrestricted;
  $("animToggle").checked = animEnabled;
  $("tempRange").value = temperature; $("tempVal").textContent = temperature;
  $("maxTokRange").value = maxTokens; $("maxTokVal").textContent = maxTokens;
  $("topPRange").value = topP; $("topPVal").textContent = topP;
  $("freqRange").value = freqPenalty; $("freqVal").textContent = freqPenalty;
  $("presRange").value = presPenalty; $("presVal").textContent = presPenalty;
  $("histRange").value = maxHistory; $("histVal").textContent = maxHistory;
  $("glowRange").value = glowLevel;
  $("settings").classList.add("open");
  buildThemeDots();
}

function closeSettings() { $("settings").classList.remove("open"); }

$("openSettings").onclick = openSettings;
$("closeSettings").onclick = closeSettings;
$("settings").onclick = (e) => { if (e.target.id === "settings") closeSettings(); };

$("saveSettings").onclick = () => {
  apiKey = $("keyInput").value.trim();
  model = $("modelInput").value.trim() || $("modelSelect").value || DEFAULT_MODEL;
  systemPrompt = $("systemInput").value.trim() || DEFAULT_SYSTEM;
  ttsEnabled = $("ttsToggle").checked;
  autoSend = $("autoSendToggle").checked;
  streamEnabled = $("streamToggle").checked;
  unrestricted = $("unrestrictedToggle").checked;
  animEnabled = $("animToggle").checked;
  temperature = parseFloat($("tempRange").value);
  maxTokens = parseInt($("maxTokRange").value);
  topP = parseFloat($("topPRange").value);
  freqPenalty = parseFloat($("freqRange").value);
  presPenalty = parseFloat($("presRange").value);
  maxHistory = parseInt($("histRange").value);
  glowLevel = parseInt($("glowRange").value);

  store.set("rosto_key", apiKey);
  store.set("rosto_model", model);
  store.set("rosto_system", systemPrompt);
  store.set("rosto_tts", ttsEnabled ? "1" : "0");
  store.set("rosto_autosend", autoSend ? "1" : "0");
  store.set("rosto_stream", streamEnabled ? "1" : "0");
  store.set("rosto_unrestricted", unrestricted ? "1" : "0");
  store.set("rosto_anim", animEnabled ? "1" : "0");
  store.set("rosto_temp", temperature);
  store.set("rosto_maxtok", maxTokens);
  store.set("rosto_topp", topP);
  store.set("rosto_freq", freqPenalty);
  store.set("rosto_pres", presPenalty);
  store.set("rosto_hist", maxHistory);
  store.set("rosto_glow", glowLevel);

  applyGlow();
  closeSettings();
  toast("تم الحفظ ✅" + (unrestricted ? " (وضع بدون قيود مفعل)" : ""));
};

$("clearAll").onclick = () => {
  if (!confirm("مسح كل شيء؟ (المحادثات + الإعدادات)")) return;
  ["rosto_chat", "rosto_key", "rosto_model", "rosto_system", "rosto_tts",
   "rosto_autosend", "rosto_stream", "rosto_theme", "rosto_temp",
   "rosto_maxtok", "rosto_topp", "rosto_freq", "rosto_pres", "rosto_hist",
   "rosto_unrestricted", "rosto_anim", "rosto_glow"
  ].forEach(store.del);
  location.reload();
};

$("modelSelect").onchange = (e) => { $("modelInput").value = e.target.value; };

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    $(tab.dataset.tab).classList.add("active");
    if (tab.dataset.tab === "t-theme") buildThemeDots();
  };
});

$("tempRange").oninput = (e) => $("tempVal").textContent = e.target.value;
$("maxTokRange").oninput = (e) => $("maxTokVal").textContent = e.target.value;
$("topPRange").oninput = (e) => $("topPVal").textContent = e.target.value;
$("freqRange").oninput = (e) => $("freqVal").textContent = e.target.value;
$("presRange").oninput = (e) => $("presVal").textContent = e.target.value;
$("histRange").oninput = (e) => $("histVal").textContent = e.target.value;
$("glowRange").oninput = (e) => {
  glowLevel = parseInt(e.target.value);
  applyGlow();
};

$("themeToggle").onclick = () => {
  const themes = ["dark", "light", "ocean", "forest", "royal", "sunset"];
  const idx = themes.indexOf(theme);
  theme = themes[(idx + 1) % themes.length];
  store.set("rosto_theme", theme);
  applyTheme();
  applyGlow();
  toast("🎨 " + theme);
};

$("micBtn").onclick = () => isRecording ? stopRecording() : startRecording();
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { attachImage(e.target.files[0]); e.target.value = ""; };
$("removeAttach").onclick = clearAttach;

$("newChat").onclick = () => {
  if (controller) controller.abort();
  messages = [];
  store.del("rosto_chat");
  showEmpty();
  toast("محادثة جديدة ✅");
};

sendBtn.onclick = () => {
  if (controller) controller.abort();
  else send(input.value);
};

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  const desktop = window.matchMedia("(pointer: fine)").matches;
  if (e.key === "Enter" && !e.shiftKey && desktop) {
    e.preventDefault();
    send(input.value);
  }
});

buildPersonaList();
buildPresetList();
buildThemeDots();
applyTheme();
applyGlow();
restore();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
