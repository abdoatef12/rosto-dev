<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROSTO">
<title>ROSTO - مساعدك الذكي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<style>
  /* ═══════════════════════════════════════════════
     DeepSeek-style Design System
     ═══════════════════════════════════════════════ */
  :root {
    --ds-primary: #4D6BFE;
    --ds-primary-hover: #3D5BEE;
    --ds-primary-light: #EEF2FF;
    --ds-bg: #FFFFFF;
    --ds-bg-secondary: #F9FAFB;
    --ds-bg-tertiary: #F3F4F6;
    --ds-sidebar: #F9FAFB;
    --ds-sidebar-hover: #EEF2FF;
    --ds-text: #1F2937;
    --ds-text-secondary: #6B7280;
    --ds-text-tertiary: #9CA3AF;
    --ds-border: #E5E7EB;
    --ds-border-light: #F3F4F6;
    --ds-code-bg: #F6F8FA;
    --ds-user-bubble: #EEF2FF;
    --ds-shadow: 0 1px 3px rgba(0,0,0,.06);
    --ds-shadow-md: 0 4px 12px rgba(0,0,0,.08);
    --ds-shadow-lg: 0 10px 30px rgba(0,0,0,.1);
    --ds-radius: 12px;
    --ds-radius-lg: 16px;
    --ds-radius-xl: 24px;
    --ds-danger: #EF4444;
    --ds-success: #10B981;
    --ds-warning: #F59E0B;
    --ds-think-bg: #FFF9F0;
    --ds-think-border: #FFE4B5;
    --ds-think-text: #8B6914;
  }

  [data-theme="dark"] {
    --ds-bg: #1A1A1A;
    --ds-bg-secondary: #222222;
    --ds-bg-tertiary: #2A2A2A;
    --ds-sidebar: #141414;
    --ds-sidebar-hover: #2A2A2A;
    --ds-text: #ECECEC;
    --ds-text-secondary: #9CA3AF;
    --ds-text-tertiary: #6B7280;
    --ds-border: #2E2E2E;
    --ds-border-light: #262626;
    --ds-code-bg: #0D0D0D;
    --ds-user-bubble: #1E2A5A;
    --ds-primary-light: #1A2246;
    --ds-shadow: 0 1px 3px rgba(0,0,0,.3);
    --ds-shadow-md: 0 4px 12px rgba(0,0,0,.4);
    --ds-shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    --ds-think-bg: #2A2418;
    --ds-think-border: #4A3F1F;
    --ds-think-text: #D4A843;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }

  body {
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic", "Helvetica Neue", Tahoma, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    display: flex;
    height: 100dvh;
    overflow: hidden;
    transition: background .3s, color .3s;
  }

  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; transition: all .15s; }
  :focus-visible { outline: 2px solid var(--ds-primary); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: rgba(77,107,254,.3); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--ds-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ds-text-tertiary); }

  /* ═══ Sidebar ═══ */
  .sidebar {
    width: 260px;
    background: var(--ds-sidebar);
    border-inline-end: 1px solid var(--ds-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    z-index: 20;
  }

  .sidebar-header {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--ds-border-light);
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 17px;
    color: var(--ds-text);
    padding: 6px 8px;
    border-radius: 8px;
    flex: 1;
    cursor: pointer;
  }

  .sidebar-logo:hover { background: var(--ds-sidebar-hover); }

  .sidebar-logo svg {
    width: 24px;
    height: 24px;
    color: var(--ds-primary);
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px;
    padding: 10px 14px;
    background: var(--ds-primary);
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(77,107,254,.3);
  }

  .new-chat-btn:hover { background: var(--ds-primary-hover); transform: translateY(-1px); }
  .new-chat-btn svg { width: 18px; height: 18px; }

  .sidebar-section-label {
    padding: 12px 16px 6px;
    font-size: 11px;
    color: var(--ds-text-tertiary);
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--ds-text);
    margin-bottom: 2px;
    position: relative;
    transition: background .15s;
  }

  .chat-item:hover { background: var(--ds-sidebar-hover); }
  .chat-item.active { background: var(--ds-sidebar-hover); color: var(--ds-primary); font-weight: 500; }

  .chat-item-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--ds-text-secondary);
  }

  .chat-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-item-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
  }

  .chat-item:hover .chat-item-actions { opacity: 1; }

  .chat-item-actions button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ds-text-secondary);
  }

  .chat-item-actions button:hover { background: var(--ds-bg-tertiary); color: var(--ds-text); }
  .chat-item-actions svg { width: 14px; height: 14px; }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--ds-border-light);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--ds-text);
    transition: background .15s;
  }

  .sidebar-btn:hover { background: var(--ds-sidebar-hover); }
  .sidebar-btn svg { width: 16px; height: 16px; color: var(--ds-text-secondary); }

  .user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
  }

  .user-profile:hover { background: var(--ds-sidebar-hover); }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--ds-primary), #7C4DFF);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
  }

  .user-name { font-size: 13px; font-weight: 500; flex: 1; }

  /* ═══ Main Content ═══ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  /* ═══ Top Bar ═══ */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--ds-border-light);
    background: var(--ds-bg);
    z-index: 10;
    flex-shrink: 0;
    min-height: 56px;
  }

  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; }

  .mobile-menu-btn {
    display: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    color: var(--ds-text);
  }

  .mobile-menu-btn:hover { background: var(--ds-bg-tertiary); }
  .mobile-menu-btn svg { width: 20px; height: 20px; }

  .model-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--ds-bg-tertiary);
    border-radius: 20px;
    font-size: 13px;
    color: var(--ds-text-secondary);
    cursor: pointer;
    transition: all .15s;
    max-width: 240px;
  }

  .model-badge:hover { background: var(--ds-primary-light); color: var(--ds-primary); }
  .model-badge svg { width: 14px; height: 14px; }
  .model-badge-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ds-text-secondary);
    transition: all .15s;
  }

  .icon-btn:hover { background: var(--ds-bg-tertiary); color: var(--ds-text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.active { color: var(--ds-primary); background: var(--ds-primary-light); }

  /* ═══ Chat Area ═══ */
  #chat {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 0;
    scroll-behavior: smooth;
    scroll-padding-top: 20px;
  }

  .chat-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ═══ Welcome Screen ═══ */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    min-height: 100%;
  }

  .welcome-logo {
    width: 80px;
    height: 80px;
    color: var(--ds-primary);
    margin-bottom: 24px;
    animation: welcomeFloat 4s ease-in-out infinite;
  }

  @keyframes welcomeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .welcome-logo svg { width: 100%; height: 100%; }

  .welcome h1 {
    font-size: 32px;
    font-weight: 600;
    color: var(--ds-text);
    margin-bottom: 8px;
    letter-spacing: -.5px;
  }

  .welcome .subtitle {
    color: var(--ds-text-secondary);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 600px;
    margin-top: 8px;
  }

  .suggestion-card {
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    border-radius: 12px;
    padding: 16px;
    text-align: right;
    transition: all .2s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .suggestion-card:hover {
    border-color: var(--ds-primary);
    background: var(--ds-primary-light);
    transform: translateY(-2px);
    box-shadow: var(--ds-shadow-md);
  }

  .suggestion-icon {
    width: 20px;
    height: 20px;
    color: var(--ds-primary);
    margin-bottom: 4px;
  }

  .suggestion-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ds-text);
  }

  .suggestion-desc {
    font-size: 12px;
    color: var(--ds-text-secondary);
    line-height: 1.5;
  }

  /* ═══ Messages ═══ */
  .msg {
    display: flex;
    gap: 16px;
    width: 100%;
    animation: msgFadeIn .3s ease-out;
  }

  @keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
  }

  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--ds-primary), #7C4DFF);
    color: #fff;
  }

  .msg.assistant .msg-avatar {
    background: var(--ds-primary-light);
    color: var(--ds-primary);
  }

  .msg.assistant .msg-avatar svg { width: 18px; height: 18px; }

  .msg-body {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
  }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .msg-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ds-text);
  }

  .msg-badge {
    font-size: 11px;
    color: var(--ds-text-tertiary);
    padding: 2px 8px;
    background: var(--ds-bg-tertiary);
    border-radius: 10px;
  }

  .msg-content {
    color: var(--ds-text);
    font-size: 15px;
    line-height: 1.75;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .msg.user .msg-content {
    color: var(--ds-text);
    background: var(--ds-user-bubble);
    padding: 10px 16px;
    border-radius: 12px;
    display: inline-block;
    max-width: 100%;
  }

  /* Reasoning / Think Box */
  .reasoning {
    background: var(--ds-think-bg);
    border: 1px solid var(--ds-think-border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    font-size: 13px;
  }

  .reasoning summary {
    cursor: pointer;
    color: var(--ds-think-text);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    list-style: none;
    user-select: none;
  }

  .reasoning summary::-webkit-details-marker { display: none; }

  .reasoning summary::after {
    content: "";
    margin-inline-start: auto;
    width: 0;
    height: 0;
    border-inline-start: 4px solid transparent;
    border-inline-end: 4px solid transparent;
    border-top: 5px solid var(--ds-think-text);
    transition: transform .2s;
  }

  .reasoning[open] summary::after { transform: rotate(180deg); }
  .reasoning summary svg { width: 14px; height: 14px; }

  .reasoning-content {
    color: var(--ds-think-text);
    white-space: pre-wrap;
    line-height: 1.65;
    max-height: 400px;
    overflow-y: auto;
    padding: 0 14px 14px;
    font-size: 13px;
    border-top: 1px solid var(--ds-think-border);
    padding-top: 10px;
  }

  /* Code Blocks */
  .msg-content code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .88em;
    background: var(--ds-code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    direction: ltr;
    unicode-bidi: embed;
    color: #D63384;
    border: 1px solid var(--ds-border);
  }

  [data-theme="dark"] .msg-content code { color: #F08A7A; }

  .msg-content pre {
    direction: ltr;
    text-align: left;
    background: var(--ds-code-bg);
    border: 1px solid var(--ds-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    line-height: 1.55;
    position: relative;
    font-size: 13px;
  }

  .msg-content pre code {
    background: none;
    padding: 0;
    font-size: 13px;
    color: var(--ds-text);
    border: 0;
  }

  .copy-code {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--ds-text-secondary);
    font-family: inherit;
    opacity: 0;
    transition: all .2s;
  }

  .msg-content pre:hover .copy-code { opacity: 1; }
  .copy-code:hover { color: var(--ds-primary); border-color: var(--ds-primary); }

  /* Message actions */
  .msg-actions {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .msg-actions button {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ds-text-tertiary);
    transition: all .15s;
  }

  .msg-actions button:hover {
    background: var(--ds-bg-tertiary);
    color: var(--ds-text);
  }

  .msg-actions button svg { width: 16px; height: 16px; }
  .msg-actions button.active { color: var(--ds-primary); background: var(--ds-primary-light); }

  .usage-badge {
    font-size: 11px;
    color: var(--ds-text-tertiary);
    background: var(--ds-bg-tertiary);
    padding: 3px 10px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Typing */
  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 8px 0;
  }

  .typing .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ds-primary);
    animation: typingBounce 1.4s infinite ease-in-out;
  }

  .typing .dot:nth-child(2) { animation-delay: .15s; }
  .typing .dot:nth-child(3) { animation-delay: .3s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Other content */
  .msg-content table {
    border-collapse: collapse;
    margin: 12px 0;
    width: 100%;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    border-radius: 8px;
  }

  .msg-content table th, .msg-content table td {
    border: 1px solid var(--ds-border);
    padding: 8px 12px;
  }

  .msg-content table th { background: var(--ds-bg-tertiary); font-weight: 600; }

  .msg-content ul, .msg-content ol { padding-inline-start: 24px; margin: 8px 0; }
  .msg-content li { margin: 4px 0; }

  .msg-content blockquote {
    border-inline-start: 3px solid var(--ds-primary);
    padding: 6px 14px;
    margin: 10px 0;
    color: var(--ds-text-secondary);
    background: var(--ds-bg-secondary);
    border-radius: 0 8px 8px 0;
  }

  .msg-content h1, .msg-content h2, .msg-content h3 {
    margin: 16px 0 8px;
    font-weight: 600;
    line-height: 1.3;
  }

  .msg-content h1 { font-size: 1.4em; }
  .msg-content h2 { font-size: 1.22em; }
  .msg-content h3 { font-size: 1.1em; }

  .msg-content a { color: var(--ds-primary); text-decoration: none; }
  .msg-content a:hover { text-decoration: underline; }
  .msg-content hr { border: 0; border-top: 1px solid var(--ds-border); margin: 16px 0; }

  /* Error message */
  .msg.error .msg-content {
    color: var(--ds-danger);
    background: rgba(239,68,68,.08);
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(239,68,68,.2);
  }

  /* ═══ Composer ═══ */
  .composer-wrap {
    padding: 16px 24px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    background: var(--ds-bg);
    flex-shrink: 0;
  }

  .composer-inner { max-width: 820px; margin: 0 auto; }

  .composer {
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    border-radius: 24px;
    padding: 12px 16px;
    transition: all .2s;
    position: relative;
  }

  .composer:focus-within {
    border-color: var(--ds-primary);
    box-shadow: 0 0 0 3px rgba(77,107,254,.1);
    background: var(--ds-bg);
  }

  .composer.drag-over {
    border-color: var(--ds-primary);
    border-style: dashed;
    background: var(--ds-primary-light);
  }

  .composer-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .composer-input {
    flex: 1;
    resize: none;
    max-height: 200px;
    background: transparent;
    border: 0;
    color: var(--ds-text);
    font: inherit;
    font-size: 15px;
    line-height: 1.6;
    padding: 6px 0;
    outline: none;
    min-height: 28px;
  }

  .composer-input::placeholder { color: var(--ds-text-tertiary); }

  .composer-bottom {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .composer-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ds-text-secondary);
    transition: all .15s;
  }

  .composer-btn:hover { background: var(--ds-bg-tertiary); color: var(--ds-text); }
  .composer-btn svg { width: 18px; height: 18px; }
  .composer-btn.recording { color: var(--ds-danger); background: rgba(239,68,68,.1); }

  .mode-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 18px;
    font-size: 13px;
    color: var(--ds-text-secondary);
    border: 1px solid var(--ds-border);
    background: var(--ds-bg);
    transition: all .15s;
    white-space: nowrap;
  }

  .mode-btn:hover { border-color: var(--ds-primary); color: var(--ds-primary); }
  .mode-btn svg { width: 14px; height: 14px; }
  .mode-btn.active {
    background: var(--ds-primary);
    color: #fff;
    border-color: var(--ds-primary);
  }
  .mode-btn.active:hover { background: var(--ds-primary-hover); color: #fff; }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--ds-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-inline-start: auto;
    transition: all .15s;
    flex-shrink: 0;
  }

  .send-btn:hover:not(:disabled) { background: var(--ds-primary-hover); transform: scale(1.05); }
  .send-btn:disabled { background: var(--ds-border); color: var(--ds-text-tertiary); cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }
  .send-btn.stop { background: var(--ds-text); color: var(--ds-bg); }

  /* Attachments */
  .attach-preview {
    display: none;
    gap: 8px;
    padding: 0 0 10px;
    overflow-x: auto;
    flex-wrap: nowrap;
  }

  .attach-preview.show { display: flex; }

  .attach-card {
    position: relative;
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--ds-border);
    background: var(--ds-bg-tertiary);
  }

  .attach-card img { width: 100%; height: 100%; object-fit: cover; }

  .attach-card .remove {
    position: absolute;
    top: 3px;
    right: 3px;
    background: rgba(0,0,0,.7);
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .attach-card .remove svg { width: 11px; height: 11px; }
  .attach-card .remove:hover { background: var(--ds-danger); }

  /* Mic wave */
  .mic-wave {
    display: none;
    gap: 2px;
    align-items: center;
    height: 20px;
    padding: 0 8px;
  }

  .mic-wave.show { display: flex; }
  .mic-wave span {
    width: 3px;
    background: var(--ds-danger);
    border-radius: 2px;
    animation: waveAnim 1s infinite ease-in-out;
  }

  .mic-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .mic-wave span:nth-child(2) { height: 14px; animation-delay: .15s; }
  .mic-wave span:nth-child(3) { height: 18px; animation-delay: .3s; }
  .mic-wave span:nth-child(4) { height: 12px; animation-delay: .45s; }
  .mic-wave span:nth-child(5) { height: 8px; animation-delay: .6s; }

  @keyframes waveAnim {
    0%, 100% { transform: scaleY(.4); }
    50% { transform: scaleY(1); }
  }

  /* ═══ Sidebar Overlay (Mobile) ═══ */
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }

  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

  /* ═══ Modal ═══ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; animation: fadeIn .2s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: 100%;
    max-width: 560px;
    background: var(--ds-bg);
    border-radius: 16px;
    padding: 24px;
    max-height: 90dvh;
    overflow-y: auto;
    box-shadow: var(--ds-shadow-lg);
    animation: modalIn .3s cubic-bezier(.22,1,.36,1);
  }

  @keyframes modalIn {
    from { transform: scale(.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal h3 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .modal .modal-sub { color: var(--ds-text-secondary); font-size: 13px; margin-bottom: 20px; }

  .modal-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--ds-border);
    overflow-x: auto;
  }

  .modal-tabs::-webkit-scrollbar { display: none; }

  .modal-tab {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--ds-text-secondary);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    font-weight: 500;
  }

  .modal-tab:hover { color: var(--ds-text); }
  .modal-tab.active { color: var(--ds-primary); border-bottom-color: var(--ds-primary); }

  .modal-tab-content { display: none; }
  .modal-tab-content.active { display: block; animation: tabIn .2s; }

  @keyframes tabIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal label {
    display: block;
    font-size: 13px;
    color: var(--ds-text);
    font-weight: 500;
    margin: 16px 0 6px;
  }

  .modal input[type="text"],
  .modal input[type="password"],
  .modal select,
  .modal textarea {
    width: 100%;
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    border-radius: 8px;
    color: var(--ds-text);
    font: inherit;
    font-size: 14px;
    padding: 10px 14px;
    transition: all .15s;
  }

  .modal input[type="text"],
  .modal input[type="password"],
  .modal select {
    direction: ltr;
    text-align: left;
  }

  .modal textarea {
    direction: rtl;
    text-align: right;
    min-height: 100px;
    resize: vertical;
    line-height: 1.65;
  }

  .modal input:focus, .modal select:focus, .modal textarea:focus {
    outline: none;
    border-color: var(--ds-primary);
    box-shadow: 0 0 0 3px rgba(77,107,254,.1);
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--ds-border-light);
    font-size: 14px;
  }

  .switch-row:last-child { border: 0; }

  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--ds-border);
    border-radius: 24px;
    transition: .2s;
  }

  .slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .2s;
  }

  .switch input:checked + .slider { background: var(--ds-primary); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .range-row { margin: 16px 0; }

  .range-row label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--ds-text);
    margin-bottom: 6px;
  }

  .range-row label span { color: var(--ds-primary); font-weight: 600; }

  .range-row input[type="range"] {
    width: 100%;
    accent-color: var(--ds-primary);
    height: 4px;
    -webkit-appearance: none;
    background: var(--ds-border);
    border-radius: 2px;
    outline: none;
  }

  .range-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ds-primary);
    cursor: pointer;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    position: sticky;
    bottom: 0;
    background: var(--ds-bg);
    padding-top: 12px;
  }

  .modal-actions button {
    flex: 1;
    height: 44px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    transition: all .15s;
  }

  .btn-primary {
    background: var(--ds-primary);
    color: #fff;
  }

  .btn-primary:hover { background: var(--ds-primary-hover); }

  .btn-ghost {
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    color: var(--ds-text);
  }

  .btn-ghost:hover { background: var(--ds-bg-tertiary); }

  .btn-danger { background: var(--ds-danger); color: #fff; }
  .btn-danger:hover { background: #DC2626; }

  .preset-btn {
    display: block;
    width: 100%;
    text-align: right;
    background: var(--ds-bg-secondary);
    border: 1px solid var(--ds-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    transition: all .15s;
  }

  .preset-btn:hover { border-color: var(--ds-primary); background: var(--ds-primary-light); }
  .preset-btn strong { display: block; color: var(--ds-text); font-weight: 600; margin-bottom: 2px; }
  .preset-btn small { display: block; color: var(--ds-text-secondary); font-size: 11px; }

  /* ═══ Toast ═══ */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ds-text);
    color: var(--ds-bg);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 300;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
    box-shadow: var(--ds-shadow-lg);
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ═══ Image Viewer ═══ */
  .img-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .2s;
    padding: 20px;
  }

  .img-viewer.show { opacity: 1; }
  .img-viewer img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 12px; }

  .img-viewer .close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,.15);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .img-viewer .close:hover { background: rgba(255,255,255,.25); }

  /* User message images */
  .msg-images {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 8px;
    max-width: 300px;
  }

  .msg-images.single { grid-template-columns: 1fr; max-width: 240px; }

  .msg-image-wrap {
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    aspect-ratio: 1;
    background: var(--ds-bg-tertiary);
  }

  .msg-images.single .msg-image-wrap { aspect-ratio: auto; }
  .msg-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ═══ Scroll Down Button ═══ */
  .scroll-down-btn {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--ds-bg);
    border: 1px solid var(--ds-border);
    color: var(--ds-text);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: all .2s;
    box-shadow: var(--ds-shadow-md);
  }

  .scroll-down-btn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .scroll-down-btn:hover { background: var(--ds-bg-tertiary); }
  .scroll-down-btn svg { width: 18px; height: 18px; }

  /* ═══ Responsive ═══ */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 280px;
      transform: translateX(100%);
      box-shadow: var(--ds-shadow-lg);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: flex; }
    .model-badge { max-width: 140px; }
  }

  @media (max-width: 600px) {
    .welcome h1 { font-size: 24px; }
    .welcome-logo { width: 64px; height: 64px; }
    .suggestions { grid-template-columns: 1fr; }
    .chat-inner { padding: 0 16px; }
    .composer-wrap { padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .modal { padding: 20px; border-radius: 16px 16px 0 0; align-self: flex-end; max-height: 92dvh; }
    .modal-overlay { align-items: flex-end; padding: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo" id="sidebarLogo">

        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

      <span>الإعدادات</span>
    </button>

    </div>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ═══ Main ═══ -->
<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="القائمة">

          <circle cx="9" cy="13" r="1.5" fill="currentColor"/>
          <circle cx="15" cy="13" r="1.5" fill="currentColor"/>

          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>

  <div id="chat">

  <button class="scroll-down-btn" id="scrollDownBtn" aria-label="التمرير للأسفل">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M19 12l-7 7-7-7"/>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2z"/>

</main>

<input type="file" id="fileInput" accept="image/*" multiple hidden>

<!-- ═══ Settings Modal ═══ -->
<div class="modal-overlay" id="settings">
  <div class="modal">
    <h3>⚙️ الإعدادات</h3>
    <p class="modal-sub">خصّص تجربتك مع ROSTO</p>

    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="t-general">عام</button>
      <button class="modal-tab" data-tab="t-persona">الشخصيات</button>
      <button class="modal-tab" data-tab="t-advanced">متقدم</button>

const idb = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("rosto_v3", 1);
      r.onupgradeneeded = () => {
        if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("kv").objectStore("kv").get(k);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
      });
    } catch { return null; }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction("kv", "readwrite");
        t.objectStore("kv").put(v, k);
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    } catch {}
  },
  async clear() {
    try {
      const db = await this.open();
      return new Promise((res) => {
        const t = db.transaction("kv", "readwrite");
        t.objectStore("kv").clear();
        t.oncomplete = () => res();
        t.onerror = () => res();
      });
    } catch {}
  }
};

const b64 = {
  enc(u8) { let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); },
  dec(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
};

async function getDeviceKey() {
  let k = await idb.get("devkey");
  if (!k) {
    k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    await idb.set("devkey", k);
  }
  return k;
}

async function saveSecureKey(plain) {
  if (!plain) { store.del("rosto_key_v3"); return; }
  try {
    const key = await getDeviceKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain));
    store.set("rosto_key_v3", b64.enc(iv) + "." + b64.enc(new Uint8Array(ct)));
  } catch (e) { console.warn("Encrypt failed:", e); }
}

async function loadSecureKey() {
  const v3 = store.get("rosto_key_v3");
  if (v3) {
    try {
      const [iv, ct] = v3.split(".").map(b64.dec);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await getDeviceKey(), ct);
      return new TextDecoder().decode(pt);
    } catch { return ""; }
  }
  return "";
}

async function fetchRetry(url, opts, maxRetries = 3, ctl = null) {
  for (let i = 0; i <= maxRetries; i++) {
    try {
      const res = await fetch(url, opts);
      if (res.ok || (res.status < 500 && res.status !== 429)) return res;
      if (i === maxRetries) return res;
      await new Promise(r => setTimeout(r, 800 * Math.pow(2, i)));
    } catch (e) {
      if (e.name === "AbortError") throw e;
      if (i === maxRetries) throw e;
      await new Promise(r => setTimeout(r, 800 * Math.pow(2, i)));
    }
  }
}

function renderSimple(text) {
  const parts = String(text).split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      const m = part.match(/^([a-zA-Z0-9+#_-]*)\n([\s\S]*?)\n?$/);
      const lang = m ? m[1] : "";
      const code = m ? m[2] : part;
      return `<pre><code class="language-${esc(lang)}">${esc(code)}</code><button class="copy-code" onclick="copyCode(this)">نسخ</button></pre>`;
    }
    let h = esc(part);
    h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    return h.replace(/\n/g, "<br>");
  }).join("");
}

function render(text) {
  if (!window.marked || !window.DOMPurify) return renderSimple(text);
  try {
    const clean = DOMPurify.sanitize(marked.parse(String(text)), {
      FORBID_TAGS: ["style", "form", "img", "iframe", "object", "embed", "input", "button", "script"],
      FORBID_ATTR: ["style", "onclick", "onerror", "onload"],
      ADD_ATTR: ["target"]
    });
    const tmp = document.createElement("div");
    tmp.innerHTML = clean;
    tmp.querySelectorAll("a[href]").forEach(a => {
      a.target = "_blank";
      a.rel = "noopener noreferrer nofollow";
    });
    tmp.querySelectorAll("pre code").forEach(el => {
      try {
        if (window.hljs && !el.dataset.hl) {
          window.hljs.highlightElement(el);
          el.dataset.hl = "1";
        }
      } catch {}
      const btn = document.createElement("button");
      btn.className = "copy-code";
      btn.textContent = "نسخ";
      btn.setAttribute("onclick", "copyCode(this)");
      el.parentElement.appendChild(btn);
    });
    return tmp.innerHTML;
  } catch (e) {
    console.warn("Render failed:", e);
    return renderSimple(text);
  }
}

window.copyCode = function(btn) {
  const codeEl = btn.parentElement.querySelector("code");
  if (!codeEl) return;
  const code = codeEl.textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "✓ تم";
    setTimeout(() => btn.textContent = "نسخ", 1500);
  }).catch(() => toast("فشل النسخ"));
};

function mkBtn(iconHtml, onclick, title = "") {
  const b = document.createElement("button");
  b.innerHTML = iconHtml;
  if (title) b.title = title;
  b.onclick = onclick;
  return b;
}

function addUserActions(el, idx) {
  const a = document.createElement("div");
  a.className = "msg-actions";
  a.append(
    mkBtn(ICON.edit, () => editMessage(idx, el), "تعديل"),
    mkBtn(ICON.copy, () => {
      navigator.clipboard.writeText(msgText(messages[idx]))
        .then(() => toast("✓ تم النسخ"))
        .catch(() => toast("فشل النسخ"));
    }, "نسخ"),
    mkBtn(ICON.trash, () => deleteMessage(idx), "حذف")
  );
  el.querySelector(".msg-body").appendChild(a);
}

function addAssistantActions(el, text, idx) {
  const a = document.createElement("div");
  a.className = "msg-actions";
  a.append(
    mkBtn(ICON.copy, () => {
      navigator.clipboard.writeText(text)
        .then(() => toast("✓ تم النسخ"))
        .catch(() => toast("فشل النسخ"));
    }, "نسخ"),
    mkBtn(ICON.speaker, () => speak(text), "نطق"),
    mkBtn(ICON.refresh, () => regenerate(idx), "إعادة توليد")
  );
  const usage = messages[idx]?.usage;
  if (usage?.t) {
    const badge = document.createElement("span");
    badge.className = "usage-badge";
    badge.textContent = `${usage.t} tokens`;
    a.appendChild(badge);
  }
  a.append(mkBtn(ICON.trash, () => deleteMessage(idx), "حذف"));
  el.querySelector(".msg-body").appendChild(a);
}

function deleteMessage(idx) {
  if (controller) return toast("⏳ انتظر انتهاء الرد");
  if (!messages[idx]) return;
  messages.splice(idx, 1);
  saveChat();
  restore();
}

function regenerate(idx) {
  if (controller) return;
  if (messages[idx]?.role !== "assistant" || idx !== messages.length - 1) return;
  const prevUserIdx = idx - 1;
  const userMsg = messages[prevUserIdx];
  if (!userMsg || userMsg.role !== "user") return;
  messages.splice(idx, 1);
  saveChat();
  restore();
  resendFrom(userMsg);
}

function resendFrom(userMsg) {
  const text = msgText(userMsg);
  const imgs = msgImgs(userMsg);
  attachments = imgs.map((url, i) => ({ dataUrl: url, name: "img" + (i + 1) }));
  renderAttachPreview();
  const lastIdx = messages.lastIndexOf(userMsg);
  if (lastIdx >= 0) messages.splice(lastIdx, 1);
  restore();
  send(text);
}

function editMessage(idx, el) {
  if (controller) return toast("⏳ انتظر");
  const m = messages[idx];
  if (!m) return;
  const body = el.querySelector(".msg-body");
  body.innerHTML = "";
  const ta = document.createElement("textarea");
  ta.className = "composer-input";
  ta.style.cssText = "width:100%;background:var(--ds-bg-secondary);border:1px solid var(--ds-border);border-radius:10px;padding:10px;color:var(--ds-text);font:inherit;min-height:60px;";
  ta.value = msgText(m);
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:6px;margin-top:8px";
  const ok = document.createElement("button");
  ok.textContent = "💾 حفظ وإرسال";
  ok.style.cssText = "background:var(--ds-primary);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500";
  ok.onclick = () => {
    const t = ta.value.trim();
    if (!t && !msgImgs(m).length) return toast("لا يوجد نص");
    const newMsg = { ...m, content: msgImgs(m).length
      ? [{ type: "text", text: t || "حلل الصورة" }, ...msgImgs(m).map(u => ({ type: "image_url", image_url: { url: u } }))]
      : t
    };
    messages.splice(idx);
    saveChat();
    restore();
    resendFrom(newMsg);
  };
  const cancel = document.createElement("button");
  cancel.textContent = "✕ إلغاء";
  cancel.style.cssText = "background:var(--ds-bg-tertiary);color:var(--ds-text);padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid var(--ds-border)";
  cancel.onclick = () => restore();
  row.append(ok, cancel);
  body.append(ta, row);
  ta.focus();
}

function renderUserMsg(text, imgs = []) {
  const el = document.createElement("div");
  el.className = "msg user";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = "أنت";
  avatar.style.fontSize = "12px";
  const body = document.createElement("div");
  body.className = "msg-body";
  const header = document.createElement("div");
  header.className = "msg-header";
  header.innerHTML = '<span class="msg-name">أنت</span>';
  const content = document.createElement("div");
  content.className = "msg-content";
  if (text) content.textContent = text;
  if (imgs.length) {
    const g = document.createElement("div");
    g.className = "msg-images" + (imgs.length === 1 ? " single" : "");

      const w = document.createElement("div");

function renderAssistantMsg(text, think, idx) {
  const el = document.createElement("div");
  el.className = "msg assistant";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.innerHTML = ICON.robot;
  const body = document.createElement("div");
  body.className = "msg-body";
  const header = document.createElement("div");
  header.className = "msg-header";
  header.innerHTML = '<span class="msg-name">ROSTO</span>';
  body.appendChild(header);

  if (think && reasoningEnabled) {
    const details = document.createElement("details");
    details.className = "reasoning";
    details.innerHTML = `<summary>${ICON.brain} تفكير الموديل</summary><div class="reasoning-content"></div>`;
    details.querySelector(".reasoning-content").textContent = think;
    body.appendChild(details);
  }

  const content = document.createElement("div");
  content.className = "msg-content";
  content.innerHTML = render(text || "");
  body.appendChild(content);
  el.append(avatar, body);
  chatInner.appendChild(el);
  return el;
}

function drawMessage(m, idx) {
  const text = msgText(m);
  if (m.role === "user") {
    const el = renderUserMsg(text, msgImgs(m).map(u => ({ dataUrl: u })));
    addUserActions(el, idx);
    return el;
  } else {
    const sp = splitThink(text);
    const think = m.reasoning || sp.think;
    const body = sp.body || text;
    const el = renderAssistantMsg(body, think, idx);
    addAssistantActions(el, body, idx);
    return el;
  }
}

function sanitizeForStorage(m) {
  const out = { role: m.role, content: m.content };
  if (m.usage) out.usage = m.usage;
  if (m.reasoning) out.reasoning = m.reasoning;
  return out;
}

function saveChat() {
  const sid = Sessions.current();
  const cur = Sessions.all()[sid];
  if (!cur) return;
  const toSave = messages.filter(m => m && m.content).slice(-80).map(sanitizeForStorage);
  const first = messages.find(m => m && m.role === "user");
  const title = msgText(first).replace(/\s+/g, " ").trim().slice(0, 40) || "محادثة جديدة";
  Sessions.update(sid, { messages: toSave, name: title });
  drawSidebar();

function setBusy(b) {
  sendBtn.classList.toggle("stop", b);
  const hasContent = input.value.trim() || attachments.length;
  sendBtn.disabled = !b && !hasContent;
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
  setBusy(!!controller);
}

function speak(text) {
  if (!("speechSynthesis" in window)) return toast("النطق غير مدعوم");
  window.speechSynthesis.cancel();
  const clean = String(text).replace(/```[\s\S]*?```/g, " كود ").replace(/[`*#_>]/g, "").slice(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ar-SA";
  u.rate = 1;
  const voices = window.speechSynthesis.getVoices();
  const arVoice = voices.find(v => v.lang.startsWith("ar"));
  if (arVoice) u.voice = arVoice;
  window.speechSynthesis.speak(u);
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "ar-EG";
  r.continuous = false;
  r.interimResults = true;
  r.onresult = (e) => {
    let t = "";
    for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
    input.value = t;
    autoGrow();
  };
  r.onerror = (e) => {
    console.warn("Speech error:", e.error);
    if (e.error === "not-allowed") toast("❌ منع الميكروفون");
    stopRecording();
  };
  r.onend = () => stopRecording();
  return r;
}

function startRecording() {
  if (!recognition) recognition = initRecognition();
  if (!recognition) return toast("الصوت غير مدعوم في متصفحك");
  try {
    recognition.start();
    isRecording = true;
    $("micBtn").classList.add("recording");
    $("micWave").classList.add("show");
  } catch { toast("الميكروفون مشغول"); }
}

function stopRecording() {
  isRecording = false;
  $("micBtn").classList.remove("recording");
  $("micWave").classList.remove("show");
  if (recognition) try { recognition.stop(); } catch {}
}

async function compressImage(file, maxDim = 1280, quality = imgQuality / 100) {
  if (!compressOn) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = (e) => res(e.target.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const r = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * r);
        height = Math.round(height * r);
      }
      const c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

async function attachImages(files) {
  const arr = [...files].filter(f => f.type.startsWith("image/"));
  if (!arr.length) return;
  for (const f of arr) {
    if (attachments.length >= MAX_IMAGES) { toast("الحد الأقصى " + MAX_IMAGES + " صور"); break; }
    try {
      const dataUrl = await compressImage(f);
      attachments.push({ dataUrl, name: f.name || "image" });
    } catch (e) { console.warn("Image load failed:", e); toast("فشل تحميل صورة"); }
  }
  renderAttachPreview();
  autoGrow();
}

function renderAttachPreview() {
  const box = $("attachPreview");
  if (!attachments.length) { box.classList.remove("show"); box.innerHTML = ""; return; }
  box.classList.add("show");
  box.innerHTML = "";
  attachments.forEach((a, i) => {
    const c = document.createElement("div");
    c.className = "attach-card";
    const im = document.createElement("img");
    im.src = a.dataUrl;
    im.alt = a.name;
    const rm = document.createElement("button");
    rm.className = "remove";
    rm.setAttribute("aria-label", "إزالة");
    rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    rm.onclick = (e) => {
      e.stopPropagation();
      attachments.splice(i, 1);
      renderAttachPreview();
      autoGrow();
    };
    c.append(im, rm);
    box.appendChild(c);
  });
}

function prepareHistory() {
  const h = messages.slice(-maxHistory);
  let lastImgIdx = -1;
  for (let i = h.length - 1; i >= 0; i--) {
    if (Array.isArray(h[i].content) && h[i].content.some(c => c.type === "image_url")) {
      lastImgIdx = i;
      break;
    }
  }
  return h.map((m, i) => {
    if (Array.isArray(m.content) && i !== lastImgIdx) {
      return { role: m.role, content: msgText(m) + " [صورة]" };
    }
    return { role: m.role, content: m.content };
  });
}

async function send(raw) {
  if (controller) return;
  const text = (raw || "").trim();
  if (!text && !attachments.length) return;
  if (!apiKey) { openSettings(); return toast("⚠️ أضف مفتاح Groq أولاً"); }

  messages = messages.filter(m => m && m.content);
  const needsVision = attachments.length > 0;
  let useModel = model;
  if (needsVision && !isVisionModel(model)) {
    if (!autoVision) {
      attachments = [];
      renderAttachPreview();
      return toast("⚠️ الموديل الحالي لا يدعم الصور");
    }
    useModel = VISION_FALLBACK;
    toast("🖼 تم التبديل لموديل الرؤية");
  }

  const imgs = attachments.slice();
  const userContent = imgs.length
    ? [{ type: "text", text: text || "حلل هذه الصورة" }, ...imgs.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } }))]
    : text;

  if (!messages.length) chatInner.innerHTML = "";
  messages.push({ role: "user", content: userContent });
  drawMessage(messages[messages.length - 1], messages.length - 1);

  attachments = [];
  renderAttachPreview();
  input.value = "";
  autoGrow();
  scrollAuto = true;

  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = `
    <div class="msg-avatar">${ICON.robot}</div>
    <div class="msg-body">
      <div class="msg-header"><span class="msg-name">ROSTO</span></div>
      <div class="msg-reason"></div>
      <div class="msg-content"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
    </div>
  `;
  chatInner.appendChild(el);
  const rBox = el.querySelector(".msg-reason");
  const cBox = el.querySelector(".msg-content");
  scrollDown(true);

  setBusy(true);
  controller = new AbortController();
  const ctl = controller;
  let partial = "";
  let reasoningBuf = "";
  let usage = null;

  const paint = () => {
    const sp = splitThink(partial);
    const rt = reasoningBuf || sp.think;
    if (rt && reasoningEnabled) {
      if (!rBox.firstChild) {
        rBox.innerHTML = '<details class="reasoning"><summary>' + ICON.brain + ' تفكير الموديل</summary><div class="reasoning-content"></div></details>';
      }
      const rc = rBox.querySelector(".reasoning-content");
      if (rc) rc.textContent = rt;
    }
    if (sp.body) cBox.innerHTML = render(sp.body);
    scrollDown();
  };

  const fail = (msg) => {
    const last = messages[messages.length - 1];
    if (last && last.role === "user") messages.pop();
    input.value = text;
    autoGrow();
    if (imgs.length) { attachments = imgs; renderAttachPreview(); }
    restore();
    const e = document.createElement("div");
    e.className = "msg assistant error";
    e.innerHTML = `<div class="msg-avatar">${ICON.robot}</div><div class="msg-body"><div class="msg-content">⚠️ ${esc(msg)}</div></div>`;
    chatInner.appendChild(e);
    scrollDown();
  };

  let finalSystem = systemPrompt || "";
  if (useSearch) finalSystem += "\n\n[ملاحظة: استخدم أحدث المعلومات المتاحة لديك]";
  if (useThink) finalSystem += "\n\n[ملاحظة: فكر خطوة بخطوة قبل الإجابة النهائية. ضع تفكيرك بين <think> و </think> ثم الإجابة النهائية.]";

  const body = {
    model: useModel,
    messages: finalSystem ? [{ role: "system", content: finalSystem.trim() }, ...prepareHistory()] : prepareHistory(),
    max_tokens: maxTokens,
    temperature,
    top_p: topP,
    stream: streamEnabled
  };
  if (REASONING_MODELS.test(useModel)) body.reasoning_format = "parsed";

  try {
    const opts = {
      method: "POST",
      headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: ctl.signal
    };

    const res = await fetchRetry(API_URL, opts, 3, ctl);

    if (!res.ok) {
      let detail = "";
      try {
        const j = await res.json();
        detail = j.error?.message || j.message || "";
      } catch {}
      return fail("خطأ " + res.status + (detail ? ": " + detail : ""));
    }

    if (!streamEnabled) {
      const data = await res.json();
      const msg = data.choices?.[0]?.message || {};
      partial = msg.content || "";
      reasoningBuf = msg.reasoning || msg.reasoning_content || "";
      usage = data.usage;
      paint();
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          let json;
          try { json = JSON.parse(data); } catch { continue; }
          usage = json.x_groq?.usage || json.usage || usage;
          const ch = json.choices?.[0];
          if (!ch) continue;
          const d = ch.delta;
          if (!d) continue;
          let changed = false;
          const rs = d.reasoning_content ?? d.reasoning;
          if (rs) { reasoningBuf += rs; changed = true; }
          if (d.content) { partial += d.content; changed = true; }
          if (changed) paint();
        }
      }
    }

    const sp = splitThink(partial);
    const finalText = sp.body || partial;
    if (!finalText.trim()) return fail("لم يصل رد من الموديل");

    el.remove();
    const msg = { role: "assistant", content: finalText };
    if (reasoningBuf || sp.think) msg.reasoning = reasoningBuf || sp.think;
    if (usage?.total_tokens) {
      msg.usage = { p: usage.prompt_tokens, c: usage.completion_tokens, t: usage.total_tokens };
    }
    messages.push(msg);
    drawMessage(msg, messages.length - 1);
    restore();
    saveChat();
    if (ttsEnabled) speak(finalText);
  } catch (e) {
    if (e.name === "AbortError") {
      const sp = splitThink(partial);
      const finalText = sp.body || partial;
      if (finalText.trim()) {
        const msg = { role: "assistant", content: finalText };
        if (reasoningBuf || sp.think) msg.reasoning = reasoningBuf || sp.think;
        messages.push(msg);
        saveChat();
      }
      restore();
      toast("⏹ تم الإيقاف");
    } else {
      console.error(e);
      fail("مشكلة في الاتصال: " + (e.message || e.name || "unknown"));
    }
  } finally {
    controller = null;
    setBusy(false);
  }
}

function openImageViewer(src) {
  const o = document.createElement("div");
  o.className = "img-viewer";
  const close = document.createElement("button");
  close.className = "close";
  close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const im = document.createElement("img");
  im.src = src;
  o.append(close, im);
  o.onclick = (e) => { if (e.target === o || e.target === close) o.remove(); };
  document.addEventListener("keydown", function esc2(e) {
    if (e.key === "Escape") { o.remove(); document.removeEventListener("keydown", esc2); }
  });
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add("show"));
}

function applyTheme() {
  let theme = themePref;
  if (themePref === "auto") {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.body.setAttribute("data-theme", theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#FFFFFF" : "#1A1A1A");
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (themePref === "auto") applyTheme();
});

function updateMuteIcon() {
  $("muteBtn").innerHTML = ttsEnabled ? ICON.speaker : ICON.speakerOff;
}

function updateModelBadge() {
  const short = model.split("/").pop().replace(/-\d{4}-\d{2}-\d{2}$/, "").replace(/-preview$/, "");
  $("modelBadgeName").textContent = short.length > 22 ? short.slice(0, 22) + "…" : short;
}

function drawSidebar() {
  const list = $("sidebarList");
  list.innerHTML = "";
  const current = Sessions.current();
  const sessions = Sessions.list();
  if (!sessions.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--ds-text-tertiary);padding:20px;font-size:13px">لا توجد محادثات</p>';
    return;
  }
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = "chat-item" + (s.id === current ? " active" : "");
    item.innerHTML = `
      <svg class="chat-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <div class="chat-item-title">${esc(s.name)}</div>
      <div class="chat-item-actions">
        <button data-act="del" title="حذف" aria-label="حذف">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>
    `;
    item.onclick = (e) => {
      if (e.target.closest("[data-act]")) {
        e.stopPropagation();
        if (confirm("حذف هذه المحادثة؟")) {
          Sessions.delete(s.id);
          if (s.id === current) {
            messages = Sessions.all()[Sessions.current()]?.messages || [];
            restore();
            updateModelBadge();
          }
          drawSidebar();
        }
        return;
      }
      if (s.id === current) { closeSidebar(); return; }
      if (messages.length) saveChat();
      Sessions.load(s.id);
      closeSidebar();
    };
    list.appendChild(item);
  });
}

function openSidebar() {
  $("sidebar").classList.add("open");
  $("sidebarOverlay").classList.add("open");
  drawSidebar();
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("sidebarOverlay").classList.remove("open");
}

function openSettings() {
  $("keyInput").value = apiKey.startsWith("gsk_") ? apiKey : "";
  $("modelInput").value = model;
  $("systemInput").value = systemPrompt;
  $("modelSelect").value = model;
  if (![...$("modelSelect").options].some(o => o.value === model)) {
    const o = document.createElement("option");
    o.value = model;
    o.textContent = model + " (مخصص)";
    $("modelSelect").appendChild(o);
    $("modelSelect").value = model;
  }
  $("autoVisionToggle").checked = autoVision;
  $("compressToggle").checked = compressOn;
  $("ttsToggle").checked = ttsEnabled;
  $("streamToggle").checked = streamEnabled;
  $("reasoningToggle").checked = reasoningEnabled;
  $("tempRange").value = temperature;
  $("tempVal").textContent = temperature;
  $("maxTokRange").value = maxTokens;
  $("maxTokVal").textContent = maxTokens;
  $("topPRange").value = topP;
  $("topPVal").textContent = topP;
  $("histRange").value = maxHistory;
  $("histVal").textContent = maxHistory;
  $("imgQRange").value = imgQuality;
  $("imgQVal").textContent = imgQuality;
  $("settings").classList.add("open");
}

function closeSettings() {
  $("settings").classList.remove("open");
}

function buildPersonaList() {
  const list = $("personaList");
  list.innerHTML = "";
  Object.entries(PERSONAS).forEach(([name, prompt]) => {
    const b = document.createElement("button");
    b.className = "preset-btn";
    b.innerHTML = `<strong>${esc(name)}</strong><small>${esc(prompt.slice(0, 70))}...</small>`;
    b.onclick = () => {
      $("systemInput").value = prompt;
      toast("✓ تم تحميل الشخصية");
    };
    list.appendChild(b);
  });
}

/* ═══ Event Listeners ═══ */
$("mobileMenuBtn").onclick = openSidebar;
$("sidebarOverlay").onclick = closeSidebar;
$("sidebarLogo").onclick = () => { scrollDown(true); closeSidebar(); };

$("themeBtn").onclick = () => {
  if (themePref === "light") themePref = "dark";
  else if (themePref === "dark") themePref = "auto";
  else themePref = "light";
  store.set("rosto_theme", themePref);
  applyTheme();
  toast(themePref === "light" ? "☀️ فاتح" : themePref === "dark" ? "🌙 داكن" : "🌗 تلقائي");
};

$("muteBtn").onclick = () => {
  ttsEnabled = !ttsEnabled;
  store.set("rosto_tts", ttsEnabled ? "1" : "0");
  updateMuteIcon();
  toast(ttsEnabled ? "🔊 الصوت مفعّل" : "🔇 الصوت مكتوم");
};

$("newChatBtn").onclick = () => {
  if (messages.length) saveChat();
  Sessions.create();
  messages = [];
  attachments = [];
  renderAttachPreview();
  restore();
  drawSidebar();
  closeSidebar();
  toast("✨ محادثة جديدة");
};

$("modelBadge").onclick = () => {
  closeSidebar();
  openSettings();
  setTimeout(() => {
    document.querySelector('.modal-tab[data-tab="t-general"]').click();
  }, 100);
};

$("openSettings").onclick = () => { closeSidebar(); openSettings(); };
$("closeSettings").onclick = closeSettings;
$("settings").onclick = (e) => { if (e.target.id === "settings") closeSettings(); };

$("saveSettings").onclick = async () => {
  const nk = $("keyInput").value.trim();
  if (nk && nk !== apiKey) {
    await saveSecureKey(nk);
    apiKey = nk;
  }
  const customModel = $("modelInput").value.trim();
  model = customModel || $("modelSelect").value;
  systemPrompt = $("systemInput").value.trim();
  autoVision = $("autoVisionToggle").checked;
  compressOn = $("compressToggle").checked;
  ttsEnabled = $("ttsToggle").checked;
  streamEnabled = $("streamToggle").checked;
  reasoningEnabled = $("reasoningToggle").checked;
  temperature = parseFloat($("tempRange").value);
  maxTokens = parseInt($("maxTokRange").value);
  topP = parseFloat($("topPRange").value);
  maxHistory = parseInt($("histRange").value);
  imgQuality = parseInt($("imgQRange").value);

  store.set("rosto_model", model);
  store.set("rosto_system", systemPrompt);
  store.set("rosto_autovision", autoVision ? "1" : "0");
  store.set("rosto_compress", compressOn ? "1" : "0");
  store.set("rosto_tts", ttsEnabled ? "1" : "0");
  store.set("rosto_stream", streamEnabled ? "1" : "0");
  store.set("rosto_reasoning", reasoningEnabled ? "1" : "0");
  store.set("rosto_temp", temperature);
  store.set("rosto_maxtok", maxTokens);
  store.set("rosto_topp", topP);
  store.set("rosto_hist", maxHistory);
  store.set("rosto_imgq", imgQuality);

  updateMuteIcon();
  updateModelBadge();
  closeSettings();
  toast("✓ تم الحفظ");
  if (nk) loadModels();
};

$$(".modal-tab").forEach(tab => {
  tab.onclick = () => {
    $$(".modal-tab").forEach(t => t.classList.remove("active"));
    $$(".modal-tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    const content = $(tab.dataset.tab);
    if (content) content.classList.add("active");
  };
});

[["temp", "tempRange"], ["maxTok", "maxTokRange"], ["topP", "topPRange"], ["hist", "histRange"], ["imgQ", "imgQRange"]]
  .forEach(([k, id]) => {
    const el = $(id);
    if (el) el.oninput = (e) => { $(k + "Val").textContent = e.target.value; };
  });

$$("[data-theme]").forEach(b => {
  b.onclick = () => {
    themePref = b.dataset.theme;
    store.set("rosto_theme", themePref);
    applyTheme();
    toast("✓ تم تطبيق الثيم");
  };
});

$("reloadModels").onclick = async () => {
  if (!apiKey || !apiKey.startsWith("gsk_")) return toast("⚠️ أضف المفتاح أولاً");
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const { data } = await r.json();
    const list = (data || []).filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id)).sort((a, b) => a.id.localeCompare(b.id));
    const sel = $("modelSelect");
    sel.innerHTML = "";
    list.forEach(m => {
      const o = document.createElement("option");
      o.value = m.id;
      o.textContent = m.id;
      sel.appendChild(o);
    });
    toast(`✓ ${list.length} موديل متاح`);
  } catch (e) { toast("❌ فشل: " + e.message); }
};

$("exportChatBtn").onclick = () => {
  if (!messages.length) return toast("لا توجد رسائل");
  const t = messages.map(m => `${m.role === "user" ? "👤 أنت" : "🐋 ROSTO"}:\n${msgText(m)}`).join("\n\n" + "─".repeat(50) + "\n\n");
  download(t, "text/plain;charset=utf-8", `rosto-chat-${Date.now()}.txt`);
  toast("✓ تم التصدير");
};

$("exportAllBtn").onclick = () => {
  const d = {
    version: 3, date: new Date().toISOString(),
    sessions: Sessions.all(), current: Sessions.current(),
    settings: { model, systemPrompt, ttsEnabled, streamEnabled, autoVision, compressOn, reasoningEnabled, themePref, temperature, maxTokens, topP, maxHistory, imgQuality }
  };
  download(JSON.stringify(d, null, 2), "application/json", `rosto-backup-${Date.now()}.json`);
  toast("✓ تم إنشاء النسخة");
};

$("restoreAllBtn").onclick = () => $("restoreFile").click();

$("restoreFile").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.sessions) throw new Error("ملف غير صالح");
    if (!confirm("⚠️ سيتم استبدال كل البيانات. متأكد؟")) { e.target.value = ""; return; }
    Sessions.save(d.sessions);
    if (d.current) store.set(Sessions.CURRENT, d.current);
    if (d.settings) {
      Object.entries(d.settings).forEach(([k, v]) => {
        const map = {
          model: "rosto_model", systemPrompt: "rosto_system", ttsEnabled: "rosto_tts",
          streamEnabled: "rosto_stream", autoVision: "rosto_autovision", compressOn: "rosto_compress",
          reasoningEnabled: "rosto_reasoning", themePref: "rosto_theme", temperature: "rosto_temp",
          maxTokens: "rosto_maxtok", topP: "rosto_topp", maxHistory: "rosto_hist", imgQuality: "rosto_imgq"
        };
        if (map[k]) {
          const val = typeof v === "boolean" ? (v ? "1" : "0") : String(v);
          store.set(map[k], val);
        }
      });
    }
    toast("✓ تمت الاستعادة");
    setTimeout(() => location.reload(), 1000);
  } catch (err) { toast("❌ فشل: " + err.message); }
  e.target.value = "";
};

$("clearAllBtn").onclick = () => {
  if (!confirm("⚠️ سيتم مسح كل شيء نهائياً. متأكد؟")) return;
  if (!confirm("🔴 تأكيد أخير!")) return;
  Object.keys(localStorage).filter(k => k.startsWith("rosto_")).forEach(k => localStorage.removeItem(k));
  idb.clear().finally(() => location.reload());
};

function download(content, mime, name) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadModels() {
  if (!apiKey || !apiKey.startsWith("gsk_")) return;
  try {
    const r = await fetch(MODELS_URL, { headers: { Authorization: "Bearer " + apiKey } });
    if (!r.ok) return;
    const { data } = await r.json();
    const list = (data || []).filter(m => m.active !== false && !/whisper|tts|guard/i.test(m.id));
    const sel = $("modelSelect");
    if (list.length) {
      sel.innerHTML = "";
      list.sort((a, b) => a.id.localeCompare(b.id)).forEach(m => {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = m.id;
        sel.appendChild(o);
      });
      if ([...sel.options].some(o => o.value === model)) {
        sel.value = model;
      } else {
        const o = document.createElement("option");
        o.value = model;
        o.textContent = model + " (مخصص)";
        sel.appendChild(o);
        sel.value = model;
      }
    }
  } catch (e) { console.warn("loadModels:", e); }
}

$("micBtn").onclick = () => isRecording ? stopRecording() : startRecording();
$("attachBtn").onclick = () => fileInput.click();
fileInput.onchange = async (e) => {
  await attachImages(e.target.files);
  e.target.value = "";
};

$("searchWebBtn").onclick = () => {
  useSearch = !useSearch;
  $("searchWebBtn").classList.toggle("active", useSearch);
  toast(useSearch ? "🔍 البحث مفعّل" : "البحث متوقف");
};

$("thinkBtn").onclick = () => {
  useThink = !useThink;
  $("thinkBtn").classList.toggle("active", useThink);
  toast(useThink ? "🧠 التفكير مفعّل" : "التفكير متوقف");
};

sendBtn.onclick = () => {
  if (controller) { controller.abort(); }
  else { send(input.value); }
};

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) {
    e.preventDefault();
    send(input.value);
  }
});

document.addEventListener("paste", async (e) => {
  if (!e.clipboardData) return;
  const files = [...e.clipboardData.items].filter(it => it.type.startsWith("image/")).map(it => it.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); await attachImages(files); }
});

["dragenter", "dragover"].forEach(evt => {
  composer.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    composer.classList.add("drag-over");
  });
});
["dragleave", "drop"].forEach(evt => {
  composer.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (evt === "drop" && e.dataTransfer?.files) attachImages(e.dataTransfer.files);
    composer.classList.remove("drag-over");
  });
});

let scrollTimer;
chat.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
    scrollAuto = atBottom;
    $("scrollDownBtn").classList.toggle("show", !atBottom && messages.length > 0);
  }, 50);
});

$("scrollDownBtn").onclick = () => {
  scrollAuto = true;
  scrollDown(true);
  $("scrollDownBtn").classList.remove("show");
};

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); $("newChatBtn").click(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "/") { e.preventDefault(); $("themeBtn").click(); }
  if (e.key === "Escape") {
    if ($("settings").classList.contains("open")) closeSettings();
    else if ($("sidebar").classList.contains("open")) closeSidebar();
  }
});

/* ═══ Init ═══ */
(async function init() {
  let savedKey = "";
  try { savedKey = await loadSecureKey(); } catch { savedKey = ""; }

  if (savedKey && savedKey.startsWith("gsk_")) {
    apiKey = savedKey;
  } else if (GROQ_API_KEY && GROQ_API_KEY.startsWith("gsk_") && GROQ_API_KEY !== "ضع_مفتاحك_هنا") {
    apiKey = GROQ_API_KEY;
    try { await saveSecureKey(apiKey); } catch {}
  } else {
    apiKey = "";
  }

  const s = Sessions.all()[Sessions.current()];
  if (s?.messages?.length) messages = s.messages.slice();
  buildPersonaList();
  applyTheme();
  updateMuteIcon();
  updateModelBadge();
  restore();
  drawSidebar();

  if (apiKey) {
    loadModels();
  } else {
    setTimeout(() => {
      toast("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", 4000);
      openSettings();
    }, 900);
  }
})();
