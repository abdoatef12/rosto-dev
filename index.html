};

$("thinkBtn").onclick = () => {
  useThink = !useThink;
  $("thinkBtn").classList.toggle("active", useThink);
  toast(useThink ? "🧠 التفكير مفعّل" : "التفكير متوقف");
};

sendBtn.onclick = () => {
  if (controller) {
    controller.abort();
  } else {
    send(input.value);
  }
};

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches) {
    e.preventDefault();
    send(input.value);
  }
});

/* ============ Paste ============ */
document.addEventListener("paste", async (e) => {
  if (!e.clipboardData) return;
  const files = [...e.clipboardData.items]
    .filter(it => it.type.startsWith("image/"))
    .map(it => it.getAsFile())
    .filter(Boolean);
  if (files.length) {
    e.preventDefault();
    await attachImages(files);
  }
});

/* ============ Drag & Drop ============ */
["dragenter", "dragover"].forEach(evt => {
  composer.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    composer.classList.add("drag-over");
  });
});
["dragleave", "drop"].forEach(evt => {
  composer.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (evt === "drop" && e.dataTransfer?.files) {
      attachImages(e.dataTransfer.files);
    }
    composer.classList.remove("drag-over");
  });
});

/* ============ Scroll handling ============ */
let scrollTimer;
chat.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
    scrollAuto = atBottom;
    $("scrollDownBtn").classList.toggle("show", !atBottom && messages.length > 0);
    $("topbar").classList.toggle("scrolled", chat.scrollTop > 8);
  }, 50);
});

$("scrollDownBtn").onclick = () => {
  scrollAuto = true;
  scrollDown(true);
  $("scrollDownBtn").classList.remove("show");
};

/* ============ Swipe gestures ============ */
let touchStartX = 0, touchStartY = 0;
document.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 60) return;
  // Swipe from right edge to open drawer
  if (dx > 60 && touchStartX < 40 && !$("drawer").classList.contains("open")) {
    openDrawer();
  }
  // Swipe left to close drawer
  if (dx < -60 && $("drawer").classList.contains("open")) {
    closeDrawer();
  }
}, { passive: true });

/* ============ Keyboard shortcuts ============ */
document.addEventListener("keydown", (e) => {
  // Ctrl/Cmd + K: New chat
  if ((e.ctrlKey || e.metaKey) && e.key === "k") {
    e.preventDefault();
    $("newChatBtn").click();
  }
  // Ctrl/Cmd + /: Toggle theme
  if ((e.ctrlKey || e.metaKey) && e.key === "/") {
    e.preventDefault();
    $("themeBtn").click();
  }
  // Escape: close modals/drawer
  if (e.key === "Escape") {
    if ($("settings").classList.contains("open")) closeSettings();
    else if ($("drawer").classList.contains("open")) closeDrawer();
  }
});

/* ============ Konami Code: secret theme ============ */
let konami = [];
const KONAMI = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
document.addEventListener("keydown", (e) => {
  konami.push(e.key);
  konami = konami.slice(-KONAMI.length);
  if (konami.join(",") === KONAMI.join(",")) {
    document.documentElement.style.filter = "hue-rotate(180deg)";
    toast("🎉 مبروك! الثيم السري!", 4000);
    setTimeout(() => { document.documentElement.style.filter = ""; }, 5000);
  }
});

/* ============ Initialize ============ */
(async function init() {
  try { apiKey = await loadSecureKey(); } catch { apiKey = ""; }
  const s = Sessions.all()[Sessions.current()];
  if (s?.messages?.length) messages = s.messages.slice();
  buildPersonaList();
  applyTheme();
  updateMuteIcon();
  restore();
  if (apiKey) loadModels();
  else setTimeout(() => {
    toast("👋 أضف مفتاح Groq من الإعدادات للبدء", 4000);
    openSettings();
  }, 900);
})();
